                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                placeholder="Detalles adicionales del evento..."
                                            />
                                        </div>

                                        {!eventoEditando && (
                                            <div className="md:col-span-2 bg-gray-50 rounded-lg p-4 border border-gray-200">
                                                <label className="flex items-center space-x-2 font-semibold text-gray-700 mb-3">
                                                    <input
                                                        type="checkbox"
                                                        checked={repetir}
                                                        onChange={(e) => setRepetir(e.target.checked)}
                                                        className="w-4 h-4"
                                                    />
                                                    <span>🔁 Repetir este evento</span>
                                                </label>
                                                {repetir && (
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                        <div>
                                                            <label className="block text-gray-700 font-semibold mb-2 text-sm">Frecuencia</label>
                                                            <select
                                                                value={frecuencia}
                                                                onChange={(e) => setFrecuencia(e.target.value)}
                                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                            >
                                                                <option value="semanal">Cada semana</option>
                                                                <option value="quincenal">Cada 2 semanas</option>
                                                                <option value="mensual">Cada mes</option>
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <label className="block text-gray-700 font-semibold mb-2 text-sm">Repetir hasta *</label>
                                                            <input
                                                                type="date"
                                                                value={repetirHasta}
                                                                onChange={(e) => setRepetirHasta(e.target.value)}
                                                                min={formData.fecha}
                                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                                required={repetir}
                                                            />

                                                        <p className="md:col-span-2 text-xs text-gray-500">
                                                            Se crearán eventos idénticos en cada fecha hasta la fecha límite. Podrás borrar solo un día o toda la serie después.
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Asignación de Responsables */}
                                <div>
                                    <h4 className="font-semibold text-gray-700 mb-3">Asignación de Responsables</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-2">🎤 Alabanza</label>
                                            <input
                                                type="text"
                                                value={formData.responsables.alabanza}
                                                onChange={(e) => setFormData({
                                                    ...formData, 
                                                    responsables: {...formData.responsables, alabanza: e.target.value}

                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                placeholder="Nombre del líder"
                                            />

                                            <label className="block text-gray-700 font-semibold mb-2">🔊 Sonido</label>
                                            <input
                                                type="text"
                                                value={formData.responsables.sonido}
                                                onChange={(e) => setFormData({
                                                    ...formData, 
                                                    responsables: {...formData.responsables, sonido: e.target.value}
                                                })}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                placeholder="Nombre del técnico"
                                            />

                                        <div>

                                                type="text"

                                            <input

                                                    ...formData, 
                                                    responsables: {...formData.responsables, ninos: e.target.value}

                                            <input

                                                placeholder="Nombre del operador"

                                            <label className="block text-gray-700 font-semibold mb-2">🙏 Oración</label>
                                            <input
                                                type="text"

                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"

                                {/* Botones */}
                                <div className="flex space-x-4">

                    {/* Vista de Calendario */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <CalendarioMensualFull 
                            eventos={eventos}
                            mesActual={mesActual}
                            anioActual={anioActual}
                            mesAnterior={mesAnterior}
                            mesSiguiente={mesSiguiente}
                            irAHoy={irAHoy}
                            handleEditar={handleEditar}
                        />
                    </div>

                    {/* Lista de Próximos Eventos */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <h3 className="text-xl font-bold text-secondary mb-4">Próximos Eventos</h3>
                        <ListaEventos 
                            eventos={eventos}
                            handleEditar={handleEditar}
                            handleEliminar={handleEliminar}
                        />
                    </div>
                </div>
            );
        }

        // ============================================
        // CALENDARIO MENSUAL COMPLETO
        // ============================================
        function CalendarioMensualFull({ eventos, mesActual, anioActual, mesAnterior, mesSiguiente, irAHoy, handleEditar }) {
            const nombresMeses = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

            const primerDia = new Date(anioActual, mesActual, 1).getDay();
            const totalDias = new Date(anioActual, mesActual + 1, 0).getDate();

            const dias = [];
            for (let i = 0; i < primerDia; i++) {
                dias.push(null);
            }
            for (let dia = 1; dia <= totalDias; dia++) {
                dias.push(dia);
            }

            const hoy = new Date();
            const esHoy = (dia) => {
                return dia === hoy.getDate() && 
                       mesActual === hoy.getMonth() && 
                       anioActual === hoy.getFullYear();
            };

            const eventosDelDia = (dia) => {
                if (!dia) return [];
                const fechaBuscada = `${anioActual}-${String(mesActual + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                return eventos.filter(e => e.fecha === fechaBuscada);
            };

            const colorEvento = {
                'Experiencia ADORA': 'bg-blue-100 border-blue-500 text-blue-800',
                'Reunión de Oración': 'bg-purple-100 border-purple-500 text-purple-800',
                'Escuela Adora': 'bg-green-100 border-green-500 text-green-800',
                'Evento Especial': 'bg-red-100 border-red-500 text-red-800',
                'Juventud': 'bg-yellow-100 border-yellow-500 text-yellow-800',
                'Niños': 'bg-pink-100 border-pink-500 text-pink-800',
                'Open House': 'bg-indigo-100 border-indigo-500 text-indigo-800',
                'Ayuno': 'bg-gray-100 border-gray-500 text-gray-800',
                'Conferencia': 'bg-orange-100 border-orange-500 text-orange-800'
            };

            return (
                <div>
                    {/* Header del calendario */}
                    <div className="flex items-center justify-between mb-6">
                        <h4 className="text-2xl font-bold text-secondary">
                            {nombresMeses[mesActual]} {anioActual}
                        </h4>
                        <div className="flex space-x-2">
                            <button 
                                onClick={mesAnterior}
                                className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold"
                            >
                                ← Anterior
                            </button>
                            <button 
                                onClick={irAHoy}
                                className="px-4 py-2 bg-primary text-white hover:bg-red-700 rounded-lg font-semibold"
                            >
                                Hoy
                            </button>
                            <button 
                                onClick={mesSiguiente}
                                className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold"
                            >
                                Siguiente →
                            </button>
                        </div>
                    </div>

                    {/* Grid del calendario */}
                    <div className="border border-gray-200 rounded-lg overflow-hidden">
                        <div className="grid grid-cols-7 bg-gray-100">
                            {diasSemana.map(dia => (
                                <div key={dia} className="text-center font-bold text-gray-700 py-3 border-r border-gray-200 last:border-r-0">
                                    {dia}
                                </div>
                            ))}
                        </div>

                        <div className="grid grid-cols-7">
                            {dias.map((dia, index) => {
                                const eventosHoy = eventosDelDia(dia);
                                
                                return (
                                    <div
                                        key={index}
                                        className={`min-h-32 p-2 border-r border-b border-gray-200 ${
                                            dia ? 'bg-white hover:bg-gray-50' : 'bg-gray-50'
                                        } ${esHoy(dia) ? 'bg-blue-50' : ''}`}
                                    >
                                        {dia && (
                                            <>
                                                <div className={`text-sm font-semibold mb-2 ${
                                                    esHoy(dia) ? 'text-blue-600' : 'text-gray-700'
                                                }`}>
                                                    {dia}
                                                    {esHoy(dia) && <span className="ml-1 text-xs">(Hoy)</span>}
                                                </div>
                                                
                                                <div className="space-y-1">
                                                    {eventosHoy.map(evento => (
                                                        <div
                                                            key={evento.id}
                                                            onClick={() => handleEditar(evento)}
                                                            className={`text-xs p-1 rounded border-l-2 cursor-pointer hover:shadow ${
                                                                colorEvento[evento.tipoEvento] || 'bg-gray-100 border-gray-500'
                                                            }`}
                                                            title={`${evento.titulo}\n${evento.horaInicio} - ${evento.horaFin || ''}`}
                                                        >
                                                            <div className="font-semibold truncate">{evento.horaInicio}</div>
                                                            <div className="truncate">{evento.titulo}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Leyenda */}
                    <div className="mt-4 flex flex-wrap gap-3 text-sm">
                        {Object.entries(colorEvento).map(([tipo, clases]) => (
                            <div key={tipo} className="flex items-center space-x-2">
                                <div className={`w-4 h-4 rounded border-l-2 ${clases}`}></div>
                                <span>{tipo}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ============================================
        // LISTA DE PRÓXIMOS EVENTOS
        // ============================================
        function ListaEventos({ eventos, handleEditar, handleEliminar }) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);

            const eventosProximos = eventos
                .filter(e => new Date(e.fecha + 'T12:00:00') >= hoy)
                .sort((a, b) => {
                    const fechaA = new Date(`${a.fecha} ${a.horaInicio}`);
                    const fechaB = new Date(`${b.fecha} ${b.horaInicio}`);
                    return fechaA - fechaB;
                })
                .slice(0, 10);

            if (eventosProximos.length === 0) {
                return (
                    <div className="text-center text-gray-500 py-8">
                        No hay eventos próximos programados
                    </div>
                );
            }

            const formatearFecha = (fecha) => {
                const f = new Date(fecha + 'T12:00:00');
                const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return f.toLocaleDateString('es-ES', opciones);
            };

            const colorBadge = {
                'Experiencia ADORA': 'bg-blue-600',
                'Reunión de Oración': 'bg-purple-600',
                'Escuela Adora': 'bg-green-600',
                'Evento Especial': 'bg-red-600',
                'Juventud': 'bg-yellow-600',
                'Niños': 'bg-pink-600',
                'Open House': 'bg-indigo-600',
                'Ayuno': 'bg-gray-600',
                'Conferencia': 'bg-orange-600'
            };

            return (
                <div className="space-y-4">
                    {eventosProximos.map(evento => (
                        <div key={evento.id} className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                            <div className="flex items-start justify-between">
                                <div className="flex-1">
                                    <div className="flex items-center space-x-3 mb-2">
                                        <span className={`text-white text-xs font-bold px-3 py-1 rounded-full ${
                                            colorBadge[evento.tipoEvento] || 'bg-gray-600'
                                        }`}>
                                            {evento.tipoEvento}
                                        </span>
                                        <h4 className="text-lg font-bold text-secondary">{evento.titulo}</h4>
                                    </div>
                                    
                                    <div className="text-sm text-gray-600 space-y-1 mb-3">
                                        <div className="flex items-center space-x-2">
                                            <span>📅</span>
                                            <span className="font-semibold capitalize">{formatearFecha(evento.fecha)}</span>
                                        </div>
                                        <div className="flex items-center space-x-2">
                                            <span>🕐</span>

                                                {evento.responsables.sonido && (
                                                    <div>🔊 <span className="font-medium">{evento.responsables.sonido}</span></div>
                                                )}
                                                {evento.responsables.bienvenida && (
                                                    <div>👋 <span className="font-medium">{evento.responsables.bienvenida}</span></div>
                                                )}
                                                {evento.responsables.ninos && (
                                                    <div>👶 <span className="font-medium">{evento.responsables.ninos}</span></div>
                                                )}
                                                {evento.responsables.multimedia && (
                                                    <div>🎥 <span className="font-medium">{evento.responsables.multimedia}</span></div>
                                                )}
                                                {evento.responsables.oracion && (
                                                    <div>🙏 <span className="font-medium">{evento.responsables.oracion}</span></div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="flex space-x-2 ml-4">
                                    <button
                                        onClick={() => handleEditar(evento)}
                                        className="text-blue-600 hover:text-blue-800 font-semibold px-3 py-1 rounded hover:bg-blue-50"
                                        title="Editar"
                                    >
                                        ✏️
                                    </button>
                                    <button
                                        onClick={() => handleEliminar(evento)}
                                        className="text-red-600 hover:text-red-800 font-semibold px-3 py-1 rounded hover:bg-red-50"

                                    >
                                        {evento.serieId ? '🗑️🔁' : '🗑️'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

                nombre: '',

                telefono: '',
                correo: '',
                fecha: new Date().toISOString().split('T')[0],
                comoLlego: 'Invitado por alguien',
                estadoCivil: 'Soltero',
                cumpleanos: '',
                motivoOracion: '',
                ubicacion: ''
            });
            const [saving, setSaving] = useState(false);
            const [filtro, setFiltro] = useState('todos'); // todos, este-mes, sin-seguimiento

            // Cargar visitantes
            useEffect(() => {
                const unsubscribe = db.collection('visitantes')
                    .orderBy('fecha', 'desc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setVisitantes(data);
                    });

                return () => unsubscribe();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);

                try {
                    if (visitanteEditando) {
                        await db.collection('visitantes').doc(visitanteEditando.id).update({
                            ...formData,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert('✓ Visitante actualizado');
                    } else {
                        await db.collection('visitantes').add({
                            ...formData,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        alert('✓ Visitante registrado');
                    }

                    limpiarFormulario();
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al guardar');
                }

                setSaving(false);
            };

            const limpiarFormulario = () => {
                setFormData({
                    nombre: '',
                    apellido: '',
                    telefono: '',
                    correo: '',
                    fecha: new Date().toISOString().split('T')[0],
                    comoLlego: 'Invitado por alguien',
                    estadoCivil: 'Soltero',
                    cumpleanos: '',
                    motivoOracion: '',
                    ubicacion: ''
                });
                setMostrarFormulario(false);
                setVisitanteEditando(null);
            };

            const handleEditar = (visitante) => {
                setVisitanteEditando(visitante);
                setFormData({
                    nombre: visitante.nombre || '',
                    apellido: visitante.apellido || '',
                    telefono: visitante.telefono || '',
                    correo: visitante.correo || '',
                    fecha: visitante.fecha || '',
                    comoLlego: visitante.comoLlego || 'Invitado por alguien',
                    estadoCivil: visitante.estadoCivil || 'Soltero',
                    cumpleanos: visitante.cumpleanos || '',
                    motivoOracion: visitante.motivoOracion || '',
                    ubicacion: visitante.ubicacion || ''
                });
                setMostrarFormulario(true);
            };

            const handleEliminar = async (id) => {
                if (window.confirm('¿Eliminar este visitante?')) {
                    try {
                        await db.collection('visitantes').doc(id).delete();
                        alert('✓ Eliminado');

                        alert('Error al eliminar');

                if (filtro === 'todos') return true;
                if (filtro === 'este-mes') {
                    const hoy = new Date();
                    const mesActual = hoy.getMonth();
                    const anioActual = hoy.getFullYear();
                    const fechaVisita = new Date(v.fecha);
                    return fechaVisita.getMonth() === mesActual && fechaVisita.getFullYear() === anioActual;
                }
                return true;

        // Componente: Gráfica de crecimiento mensual
        function GraficaCrecimientoMensual({ asistencias }) {
            const canvasRef = React.useRef(null);
            const chartRef = React.useRef(null);

            useEffect(() => {
                if (!canvasRef.current || asistencias.length === 0) return;

                // Agrupar por mes
                const datosPorMes = {};
                asistencias.forEach(a => {
                    const fecha = new Date(a.fecha);
                    const mesAnio = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}`;
                    
                    if (!datosPorMes[mesAnio]) {
                        datosPorMes[mesAnio] = { total: 0, eventos: 0 };
                    }
                    
                    datosPorMes[mesAnio].total += (parseInt(a.miembros) || 0) + (parseInt(a.ninos) || 0) + (parseInt(a.visitantes) || 0);
                    datosPorMes[mesAnio].eventos += 1;
                });

                // Ordenar por mes
                const mesesOrdenados = Object.keys(datosPorMes).sort();
                const labels = mesesOrdenados.map(m => {
                    const [anio, mes] = m.split('-');
                    const nombresMeses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                    return `${nombresMeses[parseInt(mes) - 1]} ${anio}`;
                });
                const datos = mesesOrdenados.map(m => datosPorMes[m].total);

                // Destruir gráfica anterior si existe
                if (chartRef.current) {
                    chartRef.current.destroy();
                }

                // Crear nueva gráfica
                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Total Asistencia',
                            data: datos,
                            borderColor: '#DC2626',
                            backgroundColor: 'rgba(220, 38, 38, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 5,
                            pointHoverRadius: 7
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 50
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) {
                        chartRef.current.destroy();
                    }
                };
            }, [asistencias]);

            return <div style={{ height: '300px' }}><canvas ref={canvasRef}></canvas></div>;
        }

        // Componente: Tendencias
        function Tendencias({ asistencias }) {
            if (asistencias.length < 3) {
                return <p className="text-center text-gray-500">Se necesitan más datos para calcular tendencias</p>;
            }

            // Calcular tendencia de los últimos 3 meses vs 3 meses anteriores
            const hoy = new Date();
            const hace3meses = new Date(hoy.getTime() - 90 * 24 * 60 * 60 * 1000);
            const hace6meses = new Date(hoy.getTime() - 180 * 24 * 60 * 60 * 1000);

            const ultimos3meses = asistencias.filter(a => {
                const fecha = new Date(a.fecha);
                return fecha >= hace3meses;
            });

            const anteriores3meses = asistencias.filter(a => {
                const fecha = new Date(a.fecha);
                return fecha >= hace6meses && fecha < hace3meses;
            });

            const promedioUltimos = ultimos3meses.length > 0
                ? ultimos3meses.reduce((sum, a) => sum + (parseInt(a.miembros) || 0) + (parseInt(a.ninos) || 0) + (parseInt(a.visitantes) || 0), 0) / ultimos3meses.length
                : 0;

            const promedioAnteriores = anteriores3meses.length > 0
                ? anteriores3meses.reduce((sum, a) => sum + (parseInt(a.miembros) || 0) + (parseInt(a.ninos) || 0) + (parseInt(a.visitantes) || 0), 0) / anteriores3meses.length
                : 0;

            const cambio = promedioAnteriores > 0 
                ? ((promedioUltimos - promedioAnteriores) / promedioAnteriores * 100).toFixed(1)
                : 0;

            const esCrecimiento = cambio > 0;

            return (
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-gray-50 p-6 rounded-lg">
                        <p className="text-sm text-gray-600 mb-2">Últimos 3 Meses</p>
                        <p className="text-3xl font-bold text-secondary">{Math.round(promedioUltimos)}</p>
                        <p className="text-xs text-gray-500 mt-1">promedio/evento</p>
                    </div>

                    <div className="bg-gray-50 p-6 rounded-lg">
                        <p className="text-sm text-gray-600 mb-2">3 Meses Anteriores</p>
                        <p className="text-3xl font-bold text-secondary">{Math.round(promedioAnteriores)}</p>
                        <p className="text-xs text-gray-500 mt-1">promedio/evento</p>
                    </div>

                    <div className={`p-6 rounded-lg ${esCrecimiento ? 'bg-green-50' : 'bg-red-50'}`}>
                        <p className="text-sm mb-2" style={{ color: esCrecimiento ? '#059669' : '#DC2626' }}>
                            Tendencia
                        </p>
                        <p className="text-3xl font-bold" style={{ color: esCrecimiento ? '#059669' : '#DC2626' }}>
                            {esCrecimiento ? '↗' : '↘'} {Math.abs(cambio)}%
                        </p>
                        <p className="text-xs mt-1" style={{ color: esCrecimiento ? '#059669' : '#DC2626' }}>
                            {esCrecimiento ? 'Crecimiento' : 'Decrecimiento'}
                        </p>
                    </div>
                </div>
            );
        }

        // ============================================
        // MÓDULO DE INVENTARIO COMPLETO
        // ============================================
        function Inventario({ userProfile }) {
            const [tab, setTab] = useState('consumibles'); // consumibles | activos
            const [consumibles, setConsumibles] = useState([]);
            const [activos, setActivos] = useState([]);
            const [mostrarFormulario, setMostrarFormulario] = useState(false);
            const [mostrarListaCompras, setMostrarListaCompras] = useState(false);
            const [itemEditando, setItemEditando] = useState(null);
            const [filtro, setFiltro] = useState('todos'); // todos | criticos | bajos | ok
            const [saving, setSaving] = useState(false);

            // Verificar si usuario puede editar
            const puedeEditar = userProfile && (
                userProfile.rol === 'admin' || 
                userProfile.departamento === 'Logística' ||
                userProfile.rol === 'editor_inventario'
            );

            // Cargar consumibles
            useEffect(() => {
                const unsubscribe = db.collection('inventario_consumibles')
                    .orderBy('nombre', 'asc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setConsumibles(data);
                    });
                return () => unsubscribe();
            }, []);

            // Cargar activos
            useEffect(() => {
                const unsubscribe = db.collection('inventario_activos')
                    .orderBy('nombre', 'asc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setActivos(data);
                    });
                return () => unsubscribe();
            }, []);

            // Calcular estado de semáforo para consumibles
            const getEstadoSemaforo = (item) => {
                const cantidad = parseFloat(item.cantidadActual) || 0;
                const minimo = parseFloat(item.stockMinimo) || 0;
                
                if (cantidad === 0) return 'critico';
                if (cantidad <= minimo) return 'critico';
                if (cantidad <= minimo * 1.5) return 'bajo';
                return 'ok';
            };

            // Filtrar items
            const consumiblesFiltrados = consumibles.filter(item => {
                const estado = getEstadoSemaforo(item);
                if (filtro === 'todos') return true;
                if (filtro === 'criticos') return estado === 'critico';
                if (filtro === 'bajos') return estado === 'bajo';
                if (filtro === 'ok') return estado === 'ok';
                return true;
            });

            const activosFiltrados = activos.filter(item => {
                if (filtro === 'todos') return true;
                if (filtro === 'criticos') return item.estado === 'dañado';
                if (filtro === 'bajos') return item.estado === 'mantenimiento';
                if (filtro === 'ok') return item.estado === 'operativo';
                return true;
            });

            // Estadísticas

                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">

        // Modal de Lista de Compras
        function ModalListaCompras({ consumibles, getEstadoSemaforo, onClose }) {
            const itemsParaComprar = consumibles.filter(item => {
                const estado = getEstadoSemaforo(item);
                return estado === 'critico' || estado === 'bajo';
            }).sort((a, b) => a.categoria.localeCompare(b.categoria));

            const handleImprimir = () => {
                window.print();
            };

            const handleCopiar = () => {
                let texto = '🛒 LISTA DE COMPRAS - CASA ABIERTA\n';
                texto += '═══════════════════════════════════\n\n';

                let categoriaActual = '';
                itemsParaComprar.forEach(item => {
                    if (item.categoria !== categoriaActual) {
                        categoriaActual = item.categoria;
                        texto += `\n📁 ${categoriaActual.toUpperCase()}\n`;
                        texto += '─────────────────────────────────\n';
                    }

                    const faltante = parseFloat(item.stockMinimo) - parseFloat(item.cantidadActual || 0);
                    const cantidad = faltante > 0 ? faltante : parseFloat(item.stockMinimo);
                    
                    texto += `☐ ${item.nombre}\n`;
                    texto += `   Comprar: ${cantidad} ${item.unidad}\n`;
                    if (item.observaciones) {
                        texto += `   Nota: ${item.observaciones}\n`;
                    }
                    texto += '\n';
                });

                texto += '\n═══════════════════════════════════\n';
                texto += `Fecha: ${new Date().toLocaleDateString('es-ES')}\n`;

                navigator.clipboard.writeText(texto).then(() => {
                    alert('✓ Lista copiada al portapapeles!\nPuedes pegarla en WhatsApp, notas, etc.');
                });
            };

            const handleCompartir = async () => {
                let texto = '🛒 *LISTA DE COMPRAS - CASA ABIERTA*\n\n';

                let categoriaActual = '';
                itemsParaComprar.forEach(item => {
                    if (item.categoria !== categoriaActual) {
                        categoriaActual = item.categoria;
                        texto += `\n*${categoriaActual.toUpperCase()}*\n`;
                    }

                    const faltante = parseFloat(item.stockMinimo) - parseFloat(item.cantidadActual || 0);
                    const cantidad = faltante > 0 ? faltante : parseFloat(item.stockMinimo);
                    
                    texto += `☐ ${item.nombre} - ${cantidad} ${item.unidad}\n`;
                });

                texto += `\n_${new Date().toLocaleDateString('es-ES')}_`;

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: 'Lista de Compras - Casa Abierta',
                            text: texto
                        });
                    } catch (err) {
                        handleCopiar();
                    }
                } else {
                    handleCopiar();
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-lg shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden" onClick={(e) => e.stopPropagation()}>
                        {/* Header */}
                        <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h2 className="text-2xl font-bold">🛒 Lista de Compras</h2>
                                    <p className="text-sm text-blue-100 mt-1">
                                        {itemsParaComprar.length} productos pendientes
                                    </p>
                                </div>
                                <button
                                    onClick={onClose}
                                    className="text-white hover:bg-blue-800 rounded-full w-10 h-10 flex items-center justify-center text-2xl"
                                >
                                    ✕
                                </button>
                            </div>
                        </div>

                        {/* Contenido */}
                        <div className="p-6 overflow-y-auto" style={{ maxHeight: 'calc(90vh - 200px)' }}>
                            {itemsParaComprar.length === 0 ? (
                                <div className="text-center py-12">
                                    <div className="text-6xl mb-4">✅</div>
                                    <p className="text-xl font-semibold text-gray-700">¡Todo está bien!</p>
                                    <p className="text-gray-500 mt-2">No hay productos pendientes de comprar</p>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    {/* Agrupar por categoría */}
                                    {[...new Set(itemsParaComprar.map(i => i.categoria))].map(categoria => {
                                        const itemsCategoria = itemsParaComprar.filter(i => i.categoria === categoria);
                                        
                                        return (
                                            <div key={categoria} className="border-b pb-4 last:border-b-0">
                                                <h3 className="font-bold text-lg text-gray-800 mb-3 flex items-center">
                                                    <span className="bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-sm mr-2">
                                                        {itemsCategoria.length}
                                                    </span>
                                                    {categoria}
                                                </h3>
                                                
                                                <div className="space-y-2">
                                                    {itemsCategoria.map(item => {
                                                        const estado = getEstadoSemaforo(item);
                                                        const faltante = parseFloat(item.stockMinimo) - parseFloat(item.cantidadActual || 0);
                                                        const cantidad = faltante > 0 ? faltante : parseFloat(item.stockMinimo);
                                                        const icono = estado === 'critico' ? '🔴' : '🟡';

                                                        return (
                                                            <div key={item.id} className="flex items-start p-3 bg-gray-50 rounded-lg hover:bg-gray-100">
                                                                <span className="text-2xl mr-3">{icono}</span>
                                                                <div className="flex-1">
                                                                    <div className="flex items-center justify-between">
                                                                        <h4 className="font-semibold text-gray-900">{item.nombre}</h4>
                                                                        <span className="text-sm font-bold text-blue-600">
                                                                            {cantidad} {item.unidad}
                                                                        </span>
                                                                    </div>
                                                                    {item.observaciones && (
                                                                        <p className="text-sm text-gray-600 mt-1">
                                                                            💬 {item.observaciones}
                                                                        </p>
                                                                    )}
                                                                    {item.cantidadActual > 0 && (
                                                                        <p className="text-xs text-gray-500 mt-1">
                                                                            Actual: {item.cantidadActual} {item.unidad} → Comprar: {cantidad} {item.unidad}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* Footer con fecha */}
                            {itemsParaComprar.length > 0 && (
                                <div className="mt-6 pt-4 border-t text-center text-sm text-gray-500">
                                    📅 Generada el {new Date().toLocaleDateString('es-ES', { 
                                        weekday: 'long', 
                                        year: 'numeric', 
                                        month: 'long', 
                                        day: 'numeric' 
                                    })}
                                </div>
                            )}
                        </div>

                        {/* Botones de acción */}
                        {itemsParaComprar.length > 0 && (
                            <div className="bg-gray-50 px-6 py-4 border-t flex flex-wrap gap-3">
                                <button
                                    onClick={handleImprimir}
                                    className="flex-1 bg-blue-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-blue-700 flex items-center justify-center"
                                >
                                    🖨️ Imprimir
                                </button>
                                <button
                                    onClick={handleCopiar}
                                    className="flex-1 bg-green-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-green-700 flex items-center justify-center"
                                >
                                    📋 Copiar
                                </button>
                                <button
                                    onClick={handleCompartir}
                                    className="flex-1 bg-purple-600 text-white px-4 py-3 rounded-lg font-semibold hover:bg-purple-700 flex items-center justify-center"
                                >
                                    📱 Compartir
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Formulario de Consumibles
        function FormularioConsumible({ itemEditando, setItemEditando, setMostrarFormulario, userProfile }) {
            const [formData, setFormData] = useState(itemEditando || {
                nombre: '',
                categoria: 'Bebidas',
                cantidadActual: '',
                unidad: 'unidades',
                stockMinimo: '',
                observaciones: ''
            });
            const [saving, setSaving] = useState(false);

            const categorias = ['Bebidas', 'Cocina', 'Limpieza', 'Papelería', 'Otros'];
            const unidades = ['kg', 'g', 'litros', 'ml', 'paquetes', 'rollos', 'unidades', 'cajas'];

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);

                try {
                    const dataToSave = {
                        ...formData,
                        cantidadActual: parseFloat(formData.cantidadActual) || 0,
                        stockMinimo: parseFloat(formData.stockMinimo) || 0,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedBy: userProfile.email
                    };

                    if (itemEditando) {
                        await db.collection('inventario_consumibles').doc(itemEditando.id).update(dataToSave);
                        
                        // Registrar movimiento
                        await db.collection('inventario_movimientos').add({
                            tipo: 'edicion',
                            itemId: itemEditando.id,
                            itemNombre: formData.nombre,
                            cantidadAnterior: itemEditando.cantidadActual,
                            cantidadNueva: formData.cantidadActual,
                            usuario: userProfile.email,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        alert('✓ Item actualizado');
                    } else {
                        await db.collection('inventario_consumibles').add({
                            ...dataToSave,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            createdBy: userProfile.email
                        });
                        alert('✓ Item agregado');
                    }

                    setMostrarFormulario(false);
                    setItemEditando(null);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al guardar');
                }

                setSaving(false);
            };

            return (
                <div className="bg-gray-50 border-2 border-gray-200 rounded-lg p-6">
                    <h3 className="text-xl font-bold mb-4">
                        {itemEditando ? 'Editar Consumible' : 'Agregar Nuevo Consumible'}
                    </h3>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block font-semibold mb-2">Nombre *</label>
                                <input
                                    type="text"
                                    value={formData.nombre}
                                    onChange={(e) => setFormData({...formData, nombre: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block font-semibold mb-2">Categoría *</label>
                                <select
                                    value={formData.categoria}
                                    onChange={(e) => setFormData({...formData, categoria: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                >
                                    {categorias.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block font-semibold mb-2">Cantidad Actual *</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    value={formData.cantidadActual}
                                    onChange={(e) => setFormData({...formData, cantidadActual: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                />
                            </div>
                            <div>
                                <label className="block font-semibold mb-2">Unidad *</label>
                                <select
                                    value={formData.unidad}
                                    onChange={(e) => setFormData({...formData, unidad: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                >
                                    {unidades.map(u => (
                                        <option key={u} value={u}>{u}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block font-semibold mb-2">Stock Mínimo *</label>
                                <input
                                    type="number"
                                    step="0.01"
                                    value={formData.stockMinimo}
                                    onChange={(e) => setFormData({...formData, stockMinimo: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                />

                            <div>
                                <label className="block font-semibold mb-2">Observaciones</label>
                                <input
                                    type="text"
                                    value={formData.observaciones}
                                    onChange={(e) => setFormData({...formData, observaciones: e.target.value})}

                                    placeholder="Ej: En el envase"

                            <button
                                type="button"
                                onClick={() => {
                                    setMostrarFormulario(false);
                                    setItemEditando(null);

                            >
                                ✕ Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

                nombre: '',
                categoria: 'Sonido',
                estado: 'operativo',
                cantidad: '1',
                ubicacion: '',
                responsable: '',
                costo: '',
                fechaAdquisicion: '',
                garantiaHasta: '',

            const categorias = ['Sonido', 'Limpieza', 'Cocina', 'Mobiliario', 'Multimedia', 'Otros'];

                { value: 'mantenimiento', label: '🟡 Necesita Mantenimiento', color: 'yellow' },
                { value: 'dañado', label: '🔴 Dañado', color: 'red' },

                        updatedBy: userProfile.email
                    };

                                estadoAnterior: itemEditando.estado,
                                estadoNuevo: formData.estado,
                                usuario: userProfile.email,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                        
                        alert('✓ Activo actualizado');
                    } else {
                        await db.collection('inventario_activos').add({
                            ...dataToSave,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            createdBy: userProfile.email
                        });
                        alert('✓ Activo agregado');

                    setMostrarFormulario(false);
                    setItemEditando(null);
                } catch (error) {

                    alert('Error al guardar');

                        {itemEditando ? 'Editar Activo Fijo' : 'Agregar Nuevo Activo Fijo'}
                    </h3>

                            <div>
                                <label className="block font-semibold mb-2">Nombre *</label>
                                <input
                                    type="text"
                                    value={formData.nombre}
                                    onChange={(e) => setFormData({...formData, nombre: e.target.value})}
                                    className="w-full px-4 py-2 border rounded-lg"
                                    required
                                />
                            </div>
                            <div>

        // Lista de Consumibles
        function ListaConsumibles({ items, getEstadoSemaforo, puedeEditar, setItemEditando, setMostrarFormulario, userProfile }) {
            const [mostrarMovimientos, setMostrarMovimientos] = useState(null);

            const handleAgregar = async (item) => {
                const cantidad = prompt(`¿Cuántos ${item.unidad} de ${item.nombre} agregar?`);
                if (!cantidad || isNaN(cantidad)) return;

                const nuevaCantidad = (parseFloat(item.cantidadActual) || 0) + parseFloat(cantidad);

                try {
                    await db.collection('inventario_consumibles').doc(item.id).update({
                        cantidadActual: nuevaCantidad,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedBy: userProfile.email
                    });

                    await db.collection('inventario_movimientos').add({
                        tipo: 'entrada',
                        itemId: item.id,
                        itemNombre: item.nombre,
                        cantidad: parseFloat(cantidad),
                        cantidadAnterior: item.cantidadActual,
                        cantidadNueva: nuevaCantidad,
                        usuario: userProfile.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert(`✓ Se agregaron ${cantidad} ${item.unidad}`);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al actualizar');
                }
            };

            const handleConsumir = async (item) => {
                const cantidad = prompt(`¿Cuántos ${item.unidad} de ${item.nombre} se consumieron?`);
                if (!cantidad || isNaN(cantidad)) return;

                const nuevaCantidad = Math.max(0, (parseFloat(item.cantidadActual) || 0) - parseFloat(cantidad));

                try {
                    await db.collection('inventario_consumibles').doc(item.id).update({
                        cantidadActual: nuevaCantidad,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        updatedBy: userProfile.email
                    });

                    await db.collection('inventario_movimientos').add({
                        tipo: 'salida',
                        itemId: item.id,
                        itemNombre: item.nombre,
                        cantidad: parseFloat(cantidad),
                        cantidadAnterior: item.cantidadActual,
                        cantidadNueva: nuevaCantidad,
                        usuario: userProfile.email,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert(`✓ Se consumieron ${cantidad} ${item.unidad}`);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al actualizar');
                }
            };

            const handleEliminar = async (item) => {
                if (!window.confirm(`¿Eliminar "${item.nombre}"?`)) return;

                try {
                    await db.collection('inventario_consumibles').doc(item.id).delete();
                    alert('✓ Item eliminado');
                } catch (error) {
                    alert('Error al eliminar');
                }
            };

            const coloresSemaforo = {
                critico: 'bg-red-50 border-l-4 border-red-500',
                bajo: 'bg-yellow-50 border-l-4 border-yellow-500',
                ok: 'bg-green-50 border-l-4 border-green-500'
            };

            const iconosSemaforo = {
                critico: '🔴',
                bajo: '🟡',
                ok: '🟢'
            };

            if (items.length === 0) {
                return (
                    <div className="text-center py-12 text-gray-500">
                        <div className="text-6xl mb-4">📦</div>
                        <p className="text-xl">No hay consumibles registrados</p>
                        <p className="text-sm mt-2">Agrega el primer item para comenzar</p>
                    </div>
                );
            }

            return (
                <div className="space-y-3">
                    {items.map(item => {
                        const estado = getEstadoSemaforo(item);
                        return (
                            <div key={item.id} className={`p-4 rounded-lg ${coloresSemaforo[estado]}`}>
                                <div className="flex items-start justify-between">
                                    <div className="flex-1">
                                        <div className="flex items-center space-x-3 mb-2">
                                            <span className="text-2xl">{iconosSemaforo[estado]}</span>
                                            <div>
                                                <h4 className="font-bold text-lg">{item.nombre}</h4>
                                                <p className="text-sm text-gray-600">
                                                    {item.categoria} • Stock mínimo: {item.stockMinimo} {item.unidad}
                                                </p>
                                            </div>
                                        </div>
                                        
                                        <div className="flex items-center space-x-4 text-sm">
                                            <div>
                                                <span className="text-gray-600">Cantidad actual:</span>
                                                <span className="font-bold ml-2 text-lg">
                                                    {item.cantidadActual} {item.unidad}
                                                </span>
                                            </div>
                                            {item.observaciones && (
                                                <div className="text-gray-600">
                                                    💬 {item.observaciones}
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {puedeEditar && (
                                        <div className="flex flex-col space-y-2 ml-4">
                                            <button
                                                onClick={() => handleAgregar(item)}
                                                className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700"
                                            >
                                                + Agregar
                                            </button>
                                            <button
                                                onClick={() => handleConsumir(item)}
                                                className="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-orange-700"
                                            >
                                                - Consumir
                                            </button>
                                            <div className="flex space-x-2">
                                                <button
                                                    onClick={() => {
                                                        setItemEditando(item);
                                                        setMostrarFormulario(true);
                                                    }}
                                                    className="text-blue-600 hover:bg-blue-100 px-2 py-1 rounded"
                                                >
                                                    ✏️
                                                </button>
                                                <button
                                                    onClick={() => handleEliminar(item)}
                                                    className="text-red-600 hover:bg-red-100 px-2 py-1 rounded"
                                                >
                                                    🗑️
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        }
