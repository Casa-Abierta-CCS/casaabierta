                    {mostrarForm && (
                        <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-primary">
                            <h3 className="font-bold text-lg text-secondary mb-4">✍️ Agregar Petición</h3>
                            <div className="space-y-4">
                                {/* ¿Propia o de alguien más? */}
                                <div className="flex space-x-3">
                                    <button
                                        onClick={() => setFormData({...formData, esPropiaCheck: true, nombre: nombreUsuario})}
                                        className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-all ${formData.esPropiaCheck ? 'border-primary bg-red-50 text-primary' : 'border-gray-200 text-gray-500'}`}>
                                        👤 Es mi petición
                                    </button>
                                    <button
                                        onClick={() => setFormData({...formData, esPropiaCheck: false, nombre: ''})}
                                        className={`flex-1 py-2 rounded-lg font-semibold border-2 transition-all ${!formData.esPropiaCheck ? 'border-primary bg-red-50 text-primary' : 'border-gray-200 text-gray-500'}`}>
                                        💛 Es de otra persona
                                    </button>
                                </div>

                                <div>
                                    <label className="block font-semibold mb-2 text-sm">
                                        {formData.esPropiaCheck ? '👤 Tu nombre' : '👥 Nombre de la persona'}
                                    </label>
                                    <input type="text" value={formData.nombre}
                                        onChange={e => setFormData({...formData, nombre: e.target.value})}
                                        className="w-full px-4 py-2 border rounded-lg"
                                        placeholder={formData.esPropiaCheck ? nombreUsuario : 'Ej: María López'} />
                                </div>

                                <div>
                                    <label className="block font-semibold mb-2 text-sm">✍️ Petición de oración</label>
                                    <textarea value={formData.peticion}
                                        onChange={e => setFormData({...formData, peticion: e.target.value})}
                                        rows="3" className="w-full px-4 py-2 border rounded-lg"
                                        placeholder="Escribe aquí la petición..." />
                                </div>

                                <div className="flex space-x-3">
                                    <button onClick={handleAgregar} disabled={saving}
                                        className="flex-1 bg-primary text-white py-3 rounded-lg font-bold hover:bg-red-700">
                                        {saving ? 'Guardando...' : '🙏 Agregar Petición'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Resumen */}
                    <div className="grid grid-cols-3 gap-3">
                        <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 text-center">
                            <p className="text-3xl font-bold text-orange-600">{pendientes.length}</p>
                            <p className="text-sm text-orange-700 font-semibold mt-1">🙏 Pendientes</p>
                        </div>
                        <div className="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
                            <p className="text-3xl font-bold text-green-600">{oradas.length}</p>
                            <p className="text-sm text-green-700 font-semibold mt-1">✅ Oradas</p>
                        </div>
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center">
                            <p className="text-3xl font-bold text-blue-600">{peticiones.length}</p>
                            <p className="text-sm text-blue-700 font-semibold mt-1">📋 Total</p>
                        </div>
                    </div>

                    {/* Filtros */}
                    <div className="flex space-x-2">
                        {[
                            { id: 'pendientes', label: '🙏 Pendientes', count: pendientes.length },
                            { id: 'oradas', label: '✅ Oradas', count: oradas.length },
                            { id: 'todas', label: '📋 Todas', count: peticiones.length },
                        ].map(f => (
                            <button key={f.id} onClick={() => setFiltro(f.id)}
                                className={`px-4 py-2 rounded-lg font-semibold text-sm transition-all ${filtro === f.id ? 'bg-secondary text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                {f.label} ({f.count})
                            </button>
                        ))}
                    </div>

                    {/* Lista */}
                    {loading ? (
                        <div className="text-center py-12">
                            <div className="animate-spin rounded-full h-12 w-12 border-t-4 border-primary mx-auto"></div>
                        </div>
                    ) : visibles.length === 0 ? (
                        <div className="text-center py-16 bg-white rounded-xl shadow">
                            <div className="text-6xl mb-4">🙏</div>
                            <p className="text-xl text-gray-500 font-semibold">
                                {filtro === 'pendientes' ? '¡No hay peticiones pendientes!' : 'No hay peticiones aquí'}
                            </p>
                            {filtro === 'pendientes' && (
                                <p className="text-gray-400 mt-2">Agrega la primera petición</p>
                            )}
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {visibles.map(p => (
                                <TarjetaPeticion
                                    key={p.id}
                                    peticion={p}
                                    onMarcar={handleMarcarOrada}
                                    onEliminar={handleEliminar}
                                    userProfile={userProfile}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Tarjeta individual de petición
        function TarjetaPeticion({ peticion, onMarcar, onEliminar, userProfile }) {
            const esAdmin = userProfile && (userProfile.rol === 'admin' || userProfile.rol === 'lider');
            const [expandida, setExpandida] = useState(!peticion.orada);

            return (
                <div className={`rounded-xl shadow transition-all ${peticion.orada
                    ? 'bg-gray-50 border border-gray-200 opacity-70'
                    : 'bg-white border-l-4 border-primary shadow-md'}`}>
                    <div className="p-4">
                        <div className="flex items-start space-x-3">
                            {/* Checkbox */}
                            <button onClick={() => onMarcar(peticion)}
                                className={`mt-1 flex-shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all ${peticion.orada
                                    ? 'bg-green-500 border-green-500 text-white'
                                    : 'border-gray-300 hover:border-primary'}`}>
                                {peticion.orada && <span className="text-sm">✓</span>}
                            </button>

                            <div className="flex-1 min-w-0">
                                {/* Nombre + badge */}
                                <div className="flex items-center flex-wrap gap-2 mb-1">
                                    <span className={`font-bold text-lg ${peticion.orada ? 'text-gray-400 line-through' : 'text-secondary'}`}>
                                        {peticion.nombre}
                                    </span>
                                    {peticion.orada && (
                                        <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">
                                            ✅ Orada
                                        </span>
                                    )}
                                </div>

                                {/* Petición */}
                                <p className={`text-base leading-relaxed ${peticion.orada ? 'text-gray-400' : 'text-gray-700'} ${!expandida ? 'line-clamp-2' : ''}`}>
                                    {peticion.peticion}
                                </p>

                                {/* Meta info */}
                                <div className="flex flex-wrap gap-3 mt-2 text-xs text-gray-400">
                                    {peticion.registradoPor && (
                                        <span>📝 Registrada por {peticion.registradoPor}</span>
                                    )}
                                    {peticion.createdAt && (
                                        <span>📅 {new Date(peticion.createdAt.toDate()).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</span>
                                    )}
                                    {peticion.orada && peticion.oradaAt && (
                                        <span>🙏 Orada el {new Date(peticion.oradaAt.toDate()).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}</span>
                                    )}
                                </div>
                            </div>

                            {/* Acciones */}
                            <div className="flex flex-col space-y-1 flex-shrink-0">
                                {peticion.peticion.length > 100 && (
                                    <button onClick={() => setExpandida(!expandida)}
                                        className="text-xs text-blue-500 hover:text-blue-700 px-2 py-1 rounded">
                                        {expandida ? '▲' : '▼'}
                                    </button>
                                )}
                                {(esAdmin || peticion.registradoPor === (userProfile?.nombre || userProfile?.email)) && (
                                    <button onClick={() => onEliminar(peticion.id)}
                                        className="text-red-300 hover:text-red-500 px-2 py-1 rounded text-sm">
                                        🗑️
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // MÓDULO DE FINANZAS
        // ============================================
        function Finanzas({ userProfile }) {
            const [movimientos, setMovimientos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('resumen'); // resumen | historial
            const [mesActual, setMesActual] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
            const [mostrarForm, setMostrarForm] = useState(false);
            const [tipoForm, setTipoForm] = useState('ingreso'); // ingreso | gasto
            const [editando, setEditando] = useState(null);

            const puedeEditar = userProfile && (
                userProfile.rol === 'admin' ||
                userProfile.departamento === 'Finanzas' ||
                userProfile.rol === 'lider'
            );

            // Categorías
            const categoriasIngreso = [
                { id: 'ofrenda', label: '🙏 Ofrenda del servicio', icono: '🙏' },
                { id: 'dizmo', label: '💝 Dízmo', icono: '💝' },
                { id: 'donacion', label: '🎁 Donación especial', icono: '🎁' },
                { id: 'evento', label: '🎉 Evento especial', icono: '🎉' },
                { id: 'otro_ingreso', label: '➕ Otro ingreso', icono: '➕' },
            ];

            const categoriasGasto = [
                { id: 'operativo', label: '💡 Gastos operativos', icono: '💡' },
                { id: 'inventario', label: '📦 Compras de inventario', icono: '📦' },
                { id: 'alquiler', label: '🏠 Alquiler', icono: '🏠' },
                { id: 'evento_gasto', label: '🎉 Evento especial', icono: '🎉' },
                { id: 'otro_gasto', label: '➖ Otro gasto', icono: '➖' },
            ];

            // Cargar movimientos
            useEffect(() => {
                const unsubscribe = db.collection('finanzas_movimientos')
                    .orderBy('fecha', 'desc')
                    .onSnapshot(snap => {
                        setMovimientos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setLoading(false);
                    });
                return () => unsubscribe();
            }, []);

            // Filtrar por mes
            const movimientosMes = movimientos.filter(m => m.fecha && m.fecha.startsWith(mesActual));
            const ingresosMes = movimientosMes.filter(m => m.tipo === 'ingreso');
            const gastosMes = movimientosMes.filter(m => m.tipo === 'gasto');
            const totalIngresos = ingresosMes.reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
            const totalGastos = gastosMes.reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
            const balance = totalIngresos - totalGastos;

            // Meses disponibles para navegación
            const mesesDisponibles = [...new Set(movimientos.map(m => m.fecha?.slice(0, 7)))].filter(Boolean).sort().reverse();

            const fmt = (n) => `$${parseFloat(n).toFixed(2)}`;

            const handleEliminar = async (id) => {
                if (!window.confirm('¿Eliminar este movimiento?')) return;
                await db.collection('finanzas_movimientos').doc(id).delete();
            };

            if (!puedeEditar) {
                return (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-3xl font-bold text-secondary mb-6">💰 Finanzas</h2>
                        <div className="bg-red-50 border border-red-200 rounded-xl p-8 text-center">
                            <div className="text-6xl mb-4">🔒</div>
                            <h3 className="text-xl font-bold text-red-800">Acceso Restringido</h3>
                            <p className="text-red-600 mt-2">Solo pastores, admin y Líder de Finanzas pueden ver este módulo.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* Header */}
                    <div className="flex items-center justify-between">
                        <h2 className="text-3xl font-bold text-secondary">💰 Finanzas</h2>
                        {puedeEditar && !mostrarForm && (
                            <div className="flex space-x-3">
                                <button onClick={() => { setTipoForm('ingreso'); setEditando(null); setMostrarForm(true); }}
                                    className="bg-green-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-green-700">
                                    + Ingreso
                                </button>
                                <button onClick={() => { setTipoForm('gasto'); setEditando(null); setMostrarForm(true); }}
                                    className="bg-red-600 text-white px-5 py-2.5 rounded-lg font-semibold hover:bg-red-700">
                                    + Gasto
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Formulario */}
                    {mostrarForm && (
                        <FormularioMovimiento
                            tipo={tipoForm}
                            movimiento={editando}
                            categoriasIngreso={categoriasIngreso}
                            categoriasGasto={categoriasGasto}
                            userProfile={userProfile}
                            onClose={() => { setMostrarForm(false); setEditando(null); }}
                        />
                    )}

                    {/* Selector de mes */}
                    <div className="flex items-center space-x-3">
                        <label className="font-semibold text-gray-700">📅 Mes:</label>
                        <select value={mesActual} onChange={e => setMesActual(e.target.value)}
                            className="px-4 py-2 border rounded-lg font-semibold">
                            {/* Mes actual siempre disponible */}
                            {!mesesDisponibles.includes(new Date().toISOString().slice(0, 7)) && (
                                <option value={new Date().toISOString().slice(0, 7)}>
                                    {new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                                </option>
                            )}
                            {mesesDisponibles.map(m => (
                                <option key={m} value={m}>
                                    {new Date(m + '-15').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                                </option>
                            ))}
                        </select>
                    </div>

                    {/* Tarjetas resumen */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="bg-green-50 border-l-4 border-green-500 rounded-xl p-5 shadow">
                            <p className="text-green-700 font-semibold text-sm mb-1">📥 Total Ingresos</p>
                            <p className="text-4xl font-bold text-green-600">{fmt(totalIngresos)}</p>
                            <p className="text-green-600 text-sm mt-1">{ingresosMes.length} movimiento(s)</p>
                        </div>
                        <div className="bg-red-50 border-l-4 border-red-500 rounded-xl p-5 shadow">
                            <p className="text-red-700 font-semibold text-sm mb-1">📤 Total Gastos</p>
                            <p className="text-4xl font-bold text-red-600">{fmt(totalGastos)}</p>
                            <p className="text-red-600 text-sm mt-1">{gastosMes.length} movimiento(s)</p>
                        </div>
                        <div className={`border-l-4 rounded-xl p-5 shadow ${balance >= 0 ? 'bg-blue-50 border-blue-500' : 'bg-orange-50 border-orange-500'}`}>
                            <p className={`font-semibold text-sm mb-1 ${balance >= 0 ? 'text-blue-700' : 'text-orange-700'}`}>
                                {balance >= 0 ? '✅ Balance' : '⚠️ Balance'}
                            </p>
                            <p className={`text-4xl font-bold ${balance >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>
                                {fmt(balance)}
                            </p>
                            <p className={`text-sm mt-1 ${balance >= 0 ? 'text-blue-500' : 'text-orange-500'}`}>
                                {balance >= 0 ? 'Superávit' : 'Déficit'}
                            </p>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="flex border-b">
                        <button onClick={() => setTab('resumen')} className={`px-6 py-3 font-semibold border-b-2 transition-colors ${tab === 'resumen' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                            📊 Resumen por categoría
                        </button>
                        <button onClick={() => setTab('historial')} className={`px-6 py-3 font-semibold border-b-2 transition-colors ${tab === 'historial' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                            📋 Historial completo
                        </button>
                    </div>

                    {/* Tab Resumen */}
                    {tab === 'resumen' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Ingresos por categoría */}
                            <div className="bg-white rounded-xl shadow p-5">
                                <h3 className="font-bold text-lg text-green-700 mb-4">📥 Ingresos por categoría</h3>
                                {ingresosMes.length === 0 ? (
                                    <p className="text-gray-400 italic text-center py-6">Sin ingresos este mes</p>
                                ) : (
                                    <div className="space-y-3">
                                        {categoriasIngreso.map(cat => {
                                            const items = ingresosMes.filter(m => m.categoria === cat.id);
                                            if (items.length === 0) return null;
                                            const total = items.reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
                                            const pct = totalIngresos > 0 ? (total / totalIngresos * 100) : 0;
                                            return (
                                                <div key={cat.id}>
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="font-semibold">{cat.icono} {cat.label.split(' ').slice(1).join(' ')}</span>
                                                        <span className="font-bold text-green-600">{fmt(total)}</span>
                                                    </div>
                                                    <div className="w-full bg-gray-100 rounded-full h-2">
                                                        <div className="bg-green-500 h-2 rounded-full" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Gastos por categoría */}
                            <div className="bg-white rounded-xl shadow p-5">
                                <h3 className="font-bold text-lg text-red-700 mb-4">📤 Gastos por categoría</h3>
                                {gastosMes.length === 0 ? (
                                    <p className="text-gray-400 italic text-center py-6">Sin gastos este mes</p>
                                ) : (
                                    <div className="space-y-3">
                                        {categoriasGasto.map(cat => {
                                            const items = gastosMes.filter(m => m.categoria === cat.id);
                                            if (items.length === 0) return null;
                                            const total = items.reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
                                            const pct = totalGastos > 0 ? (total / totalGastos * 100) : 0;
                                            return (
                                                <div key={cat.id}>
                                                    <div className="flex justify-between text-sm mb-1">
                                                        <span className="font-semibold">{cat.icono} {cat.label.split(' ').slice(1).join(' ')}</span>
                                                        <span className="font-bold text-red-600">{fmt(total)}</span>
                                                    </div>
                                                    <div className="w-full bg-gray-100 rounded-full h-2">
                                                        <div className="bg-red-500 h-2 rounded-full" style={{ width: `${pct}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Resumen histórico de todos los meses */}
                            {mesesDisponibles.length > 1 && (
                                <div className="md:col-span-2 bg-white rounded-xl shadow p-5">
                                    <h3 className="font-bold text-lg text-secondary mb-4">📈 Balance histórico</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead>
                                                <tr className="border-b">
                                                    <th className="text-left py-2 text-gray-600">Mes</th>
                                                    <th className="text-right py-2 text-green-600">Ingresos</th>
                                                    <th className="text-right py-2 text-red-600">Gastos</th>
                                                    <th className="text-right py-2 text-secondary">Balance</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {mesesDisponibles.map(mes => {
                                                    const mvMes = movimientos.filter(m => m.fecha?.startsWith(mes));
                                                    const ing = mvMes.filter(m => m.tipo === 'ingreso').reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
                                                    const gas = mvMes.filter(m => m.tipo === 'gasto').reduce((s, m) => s + (parseFloat(m.monto) || 0), 0);
                                                    const bal = ing - gas;
                                                    return (
                                                        <tr key={mes} className="border-b hover:bg-gray-50 cursor-pointer" onClick={() => setMesActual(mes)}>
                                                            <td className="py-3 font-semibold capitalize">
                                                                {new Date(mes + '-15').toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}
                                                            </td>
                                                            <td className="py-3 text-right text-green-600 font-semibold">{fmt(ing)}</td>
                                                            <td className="py-3 text-right text-red-600 font-semibold">{fmt(gas)}</td>
                                                            <td className={`py-3 text-right font-bold ${bal >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>{fmt(bal)}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Tab Historial */}
                    {tab === 'historial' && (
                        <div className="bg-white rounded-xl shadow overflow-hidden">
                            {movimientosMes.length === 0 ? (
                                <div className="text-center py-16">
                                    <div className="text-6xl mb-4">💳</div>
                                    <p className="text-xl text-gray-500">Sin movimientos este mes</p>
                                    <p className="text-gray-400 mt-1">Registra el primer ingreso o gasto</p>
                                </div>
                            ) : (
                                <table className="w-full">
                                    <thead className="bg-gray-50 border-b">
                                        <tr>
                                            <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Fecha</th>
                                            <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Descripción</th>
                                            <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Categoría</th>
                                            <th className="text-right px-5 py-3 text-sm font-semibold text-gray-600">Monto</th>
                                            {puedeEditar && <th className="px-5 py-3"></th>}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {movimientosMes.map(m => {
                                            const cats = m.tipo === 'ingreso' ? categoriasIngreso : categoriasGasto;
                                            const cat = cats.find(c => c.id === m.categoria);
                                            return (
                                                <tr key={m.id} className="hover:bg-gray-50">
                                                    <td className="px-5 py-3 text-sm text-gray-600">
                                                        {new Date(m.fecha + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}
                                                    </td>
                                                    <td className="px-5 py-3">
                                                        <p className="font-semibold text-secondary">{m.descripcion}</p>
                                                        {m.notas && <p className="text-xs text-gray-400">{m.notas}</p>}
                                                    </td>
                                                    <td className="px-5 py-3">
                                                        <span className={`text-xs px-2 py-1 rounded-full font-semibold ${m.tipo === 'ingreso' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                            {cat?.icono} {cat?.label.split(' ').slice(1).join(' ') || m.categoria}
                                                        </span>
                                                    </td>
                                                    <td className={`px-5 py-3 text-right font-bold text-lg ${m.tipo === 'ingreso' ? 'text-green-600' : 'text-red-600'}`}>
                                                        {m.tipo === 'ingreso' ? '+' : '-'}{fmt(m.monto)}
                                                    </td>
                                                    {puedeEditar && (
                                                        <td className="px-5 py-3">
                                                            <div className="flex space-x-1">
                                                                <button onClick={() => { setEditando(m); setTipoForm(m.tipo); setMostrarForm(true); }}
                                                                    className="text-blue-500 hover:bg-blue-50 px-2 py-1 rounded">✏️</button>
                                                                <button onClick={() => handleEliminar(m.id)}
                                                                    className="text-red-400 hover:bg-red-50 px-2 py-1 rounded">🗑️</button>
                                                            </div>
                                                        </td>
                                                    )}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                    {/* Totales */}
                                    <tfoot className="bg-gray-50 border-t-2 border-gray-300">
                                        <tr>
                                            <td colSpan="3" className="px-5 py-3 font-bold text-secondary">Total del mes</td>
                                            <td className={`px-5 py-3 text-right font-bold text-xl ${balance >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>
                                                {fmt(balance)}
                                            </td>
                                            {puedeEditar && <td></td>}
                                        </tr>
                                    </tfoot>
                                </table>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Formulario para registrar ingreso o gasto
        function FormularioMovimiento({ tipo, movimiento, categoriasIngreso, categoriasGasto, userProfile, onClose }) {
            const categorias = tipo === 'ingreso' ? categoriasIngreso : categoriasGasto;
            const [formData, setFormData] = useState({
                tipo: tipo,
                fecha: movimiento?.fecha || new Date().toISOString().split('T')[0],
                categoria: movimiento?.categoria || categorias[0].id,
                descripcion: movimiento?.descripcion || '',
                monto: movimiento?.monto || '',
                notas: movimiento?.notas || ''
            });
            const [saving, setSaving] = useState(false);

            const handleGuardar = async () => {
                if (!formData.monto || !formData.descripcion || !formData.fecha) {
                    alert('Fecha, descripción y monto son obligatorios');
                    return;
                }
                if (parseFloat(formData.monto) <= 0) {
                    alert('El monto debe ser mayor a 0');
                    return;
                }
                setSaving(true);
                try {
                    const data = {
                        ...formData,
                        monto: parseFloat(formData.monto),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        registradoPor: userProfile?.nombre || userProfile?.email
                    };
                    if (movimiento) {
                        await db.collection('finanzas_movimientos').doc(movimiento.id).update(data);
                    } else {
                        await db.collection('finanzas_movimientos').add({
                            ...data,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    onClose();
                } catch (e) {
                    alert('Error al guardar');
                }
                setSaving(false);
            };

            const esIngreso = tipo === 'ingreso';

            return (
                <div className={`bg-white rounded-xl shadow-lg p-6 border-2 ${esIngreso ? 'border-green-500' : 'border-red-500'}`}>
                    <div className="flex items-center justify-between mb-5">
                        <h3 className={`text-xl font-bold ${esIngreso ? 'text-green-700' : 'text-red-700'}`}>
                            {movimiento ? '✏️ Editar' : (esIngreso ? '📥 Registrar Ingreso' : '📤 Registrar Gasto')}
                        </h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Fecha *</label>
                            <input type="date" value={formData.fecha}
                                onChange={e => setFormData({...formData, fecha: e.target.value})}
                                className="w-full px-3 py-2 border rounded-lg" />
                        </div>
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Categoría *</label>
                            <select value={formData.categoria}
                                onChange={e => setFormData({...formData, categoria: e.target.value})}
                                className="w-full px-3 py-2 border rounded-lg">
                                {categorias.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Descripción *</label>
                            <input type="text" value={formData.descripcion}
                                onChange={e => setFormData({...formData, descripcion: e.target.value})}
                                className="w-full px-3 py-2 border rounded-lg"
                                placeholder={esIngreso ? 'Ej: Ofrenda servicio 16 Feb' : 'Ej: Pago de alquiler febrero'} />
                        </div>
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Monto (USD) *</label>
                            <div className="relative">
                                <span className="absolute left-3 top-2.5 text-gray-500 font-bold">$</span>
                                <input type="number" step="0.01" min="0" value={formData.monto}
                                    onChange={e => setFormData({...formData, monto: e.target.value})}
                                    className="w-full pl-7 pr-3 py-2 border rounded-lg"
                                    placeholder="0.00" />
                            </div>
                        </div>
                        <div className="md:col-span-2">
                            <label className="block font-semibold mb-2 text-sm">Notas (opcional)</label>
                            <input type="text" value={formData.notas}
                                onChange={e => setFormData({...formData, notas: e.target.value})}
                                className="w-full px-3 py-2 border rounded-lg"
                                placeholder="Detalle adicional..." />
                        </div>
                    </div>

                    <div className="flex space-x-3">
                        <button onClick={handleGuardar} disabled={saving}
                            className={`flex-1 text-white py-3 rounded-lg font-bold ${esIngreso ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                            {saving ? 'Guardando...' : `✓ Guardar ${esIngreso ? 'Ingreso' : 'Gasto'}`}
                        </button>
                        <button onClick={onClose} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">
                            ✕ Cancelar
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================
        // EVANGELISMO
        // ============================================
        function Evangelismo() {
            const [salidas, setSalidas] = useState([]);
            const [mostrarForm, setMostrarForm] = useState(false);
            const [salidaEditando, setSalidaEditando] = useState(null);
            const [detalleSalidaId, setDetalleSalidaId] = useState(null);
            const [saving, setSaving] = useState(false);
            const [filtroMes, setFiltroMes] = useState('todos');

            const formVacio = {
                fecha: new Date().toISOString().split('T')[0],
                zona: '',
                tipo: 'En la calle',
                notas: '',
                contactos: []
            };
            const [formData, setFormData] = useState(formVacio);
            const [nuevoContacto, setNuevoContacto] = useState({ nombre: '', telefono: '', interes: false });

            useEffect(() => {
                const unsubscribe = db.collection('evangelismo_salidas')
                    .orderBy('fecha', 'desc')
                    .onSnapshot(snapshot => {
                        setSalidas(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                return () => unsubscribe();
            }, []);

            const agregarContacto = () => {
                if (!nuevoContacto.nombre.trim()) return;
                setFormData(prev => ({
                    ...prev,
                    contactos: [...prev.contactos, { ...nuevoContacto }]
                }));
                setNuevoContacto({ nombre: '', telefono: '', interes: false });
            };

            const eliminarContacto = (idx) => {
                setFormData(prev => ({
                    ...prev,
                    contactos: prev.contactos.filter((_, i) => i !== idx)
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSaving(true);
                try {
                    const datos = {
                        ...formData,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (salidaEditando) {
                        await db.collection('evangelismo_salidas').doc(salidaEditando.id).update(datos);
                        alert('✓ Salida actualizada');
                    } else {
                        await db.collection('evangelismo_salidas').add(datos);
                        alert('✓ Salida registrada');
                    }
                    cerrarForm();
                } catch (err) {
                    alert('Error al guardar');
                }
                setSaving(false);
            };

            const cerrarForm = () => {
                setFormData(formVacio);
                setSalidaEditando(null);
                setMostrarForm(false);
                setNuevoContacto({ nombre: '', telefono: '', interes: false });
            };

            const editarSalida = (salida) => {
                setSalidaEditando(salida);
                setFormData({
                    fecha: salida.fecha || '',
                    zona: salida.zona || '',
                    tipo: salida.tipo || 'En la calle',
                    notas: salida.notas || '',
                    contactos: salida.contactos || []
                });
                setMostrarForm(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const eliminarSalida = async (id) => {
                if (window.confirm('¿Eliminar esta salida de evangelismo?')) {
                    try {
                        await db.collection('evangelismo_salidas').doc(id).delete();
                        alert('✓ Eliminado');
                    } catch (err) {
                        alert('Error al eliminar');
                    }
                }
            };

            const convertirAVisitante = async (contacto, salidaFecha) => {
                if (!window.confirm(`¿Agregar a ${contacto.nombre} como visitante?`)) return;
                try {
                    await db.collection('visitantes').add({
                        nombre: contacto.nombre,
                        apellido: '',
                        telefono: contacto.telefono || '',
                        correo: '',
                        fecha: salidaFecha,
                        comoLlego: 'Evangelismo',
                        estadoCivil: 'Soltero',
                        cumpleanos: '',
                        motivoOracion: '',
                        ubicacion: '',
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert(`✓ ${contacto.nombre} agregado como visitante`);
                } catch (err) {
                    alert('Error al convertir a visitante');
                }
            };

            const hoy = new Date();
            const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
            const salidaEsteMes = salidas.filter(s => s.fecha && s.fecha.startsWith(mesActual));
            const totalContactos = salidas.reduce((acc, s) => acc + (s.contactos ? s.contactos.length : 0), 0);
            const conInteres = salidas.reduce((acc, s) => acc + (s.contactos ? s.contactos.filter(c => c.interes).length : 0), 0);

            const mesesDisponibles = [...new Set(
                salidas.map(s => s.fecha ? s.fecha.substring(0, 7) : null).filter(Boolean)
            )].sort().reverse();

            const salidaFiltradas = salidas.filter(s => {
                if (filtroMes === 'todos') return true;
                return s.fecha && s.fecha.startsWith(filtroMes);
            });

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* Header */}
                    <div className="flex items-center justify-between">
                        <h2 className="text-3xl font-bold text-secondary">Evangelismo</h2>
                        <button
                            onClick={() => { if (mostrarForm) cerrarForm(); else setMostrarForm(true); }}
                            className="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700"
                        >
                            {mostrarForm ? '✕ Cancelar' : '+ Nueva Salida'}
                        </button>
                    </div>

                    {/* Estadísticas */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white rounded-lg shadow p-4">
                            <p className="text-gray-500 text-sm">Total Salidas</p>
                            <p className="text-3xl font-bold text-secondary">{salidas.length}</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                            <p className="text-gray-500 text-sm">Salidas este Mes</p>
                            <p className="text-3xl font-bold text-blue-600">{salidaEsteMes.length}</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                            <p className="text-gray-500 text-sm">Total Contactos</p>
                            <p className="text-3xl font-bold text-green-600">{totalContactos}</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4">
                            <p className="text-gray-500 text-sm">Con Interés</p>
                            <p className="text-3xl font-bold text-yellow-500">{conInteres}</p>
                        </div>
                    </div>

                    {/* Formulario */}
                    {mostrarForm && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-xl font-bold mb-4">
                                {salidaEditando ? '✏️ Editar Salida' : '+ Registrar Nueva Salida'}
                            </h3>
                            <form onSubmit={handleSubmit} className="space-y-5">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block font-semibold mb-1 text-sm">Fecha *</label>
                                        <input
                                            type="date"
                                            value={formData.fecha}
                                            onChange={e => setFormData({...formData, fecha: e.target.value})}
                                            className="w-full px-3 py-2 border rounded-lg"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1 text-sm">Zona / Lugar *</label>
                                        <input
                                            type="text"
                                            value={formData.zona}
                                            onChange={e => setFormData({...formData, zona: e.target.value})}
                                            className="w-full px-3 py-2 border rounded-lg"
                                            placeholder="Ej: Plaza Bolívar, Petare..."
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-1 text-sm">Tipo de Evangelismo</label>
                                        <select
                                            value={formData.tipo}
                                            onChange={e => setFormData({...formData, tipo: e.target.value})}
                                            className="w-full px-3 py-2 border rounded-lg"
                                        >
                                            <option>En la calle</option>
                                            <option>Casa a casa</option>
                                            <option>Plaza / Parque</option>
                                            <option>Evento especial</option>
                                            <option>Otro</option>
                                        </select>
                                    </div>
                                    <div className="md:col-span-3">
                                        <label className="block font-semibold mb-1 text-sm">Notas / Observaciones</label>
                                        <textarea
                                            value={formData.notas}
                                            onChange={e => setFormData({...formData, notas: e.target.value})}
                                            rows="2"
                                            className="w-full px-3 py-2 border rounded-lg"
                                            placeholder="Cómo resultó, condiciones especiales, observaciones..."
                                        />
                                    </div>
                                </div>

                                {/* Sección de Contactos */}
                                <div className="border-t pt-4">
                                    <h4 className="font-bold text-gray-700 mb-3">
                                        Contactos Recolectados
                                        <span className="ml-2 bg-primary text-white text-xs px-2 py-0.5 rounded-full">{formData.contactos.length}</span>
                                    </h4>

                                    {formData.contactos.length > 0 && (
                                        <div className="space-y-2 mb-4">
                                            {formData.contactos.map((c, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-gray-50 px-3 py-2 rounded-lg border">
                                                    <div className="flex items-center space-x-3">
                                                        <div className="w-7 h-7 bg-gray-300 rounded-full flex items-center justify-center text-xs font-bold text-gray-700">
                                                            {c.nombre.charAt(0).toUpperCase()}
                                                        </div>
                                                        <span className="font-medium text-sm">{c.nombre}</span>
                                                        {c.telefono && <span className="text-gray-500 text-sm">📞 {c.telefono}</span>}
                                                        {c.interes && <span className="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full">⭐ Con interés</span>}
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={() => eliminarContacto(idx)}
                                                        className="text-red-500 hover:text-red-700 font-bold px-2"
                                                    >✕</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                        <p className="text-sm font-semibold text-blue-700 mb-3">Agregar contacto</p>
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                            <input
                                                type="text"
                                                value={nuevoContacto.nombre}
                                                onChange={e => setNuevoContacto({...nuevoContacto, nombre: e.target.value})}
                                                placeholder="Nombre *"
                                                className="px-3 py-2 border rounded-lg text-sm md:col-span-1"
                                                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); agregarContacto(); }}}
                                            />
                                            <input
                                                type="tel"
                                                value={nuevoContacto.telefono}
                                                onChange={e => setNuevoContacto({...nuevoContacto, telefono: e.target.value})}
                                                placeholder="Teléfono"
                                                className="px-3 py-2 border rounded-lg text-sm md:col-span-1"
                                                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); agregarContacto(); }}}
                                            />
                                            <label className="flex items-center space-x-2 cursor-pointer md:col-span-1">
                                                <input
                                                    type="checkbox"
                                                    checked={nuevoContacto.interes}
                                                    onChange={e => setNuevoContacto({...nuevoContacto, interes: e.target.checked})}
                                                    className="w-4 h-4"
                                                />
                                                <span className="text-sm text-gray-700">Mostró interés</span>
                                            </label>
                                            <button
                                                type="button"
                                                onClick={agregarContacto}
                                                className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700 md:col-span-1"
                                            >
                                                + Agregar
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex space-x-3">
                                    <button
                                        type="submit"
                                        disabled={saving}
                                        className="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 disabled:opacity-50"
                                    >
                                        {saving ? 'Guardando...' : '✓ Guardar Salida'}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={cerrarForm}
                                        className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300"
                                    >
                                        ✕ Cancelar
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Historial */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-xl font-bold">Historial de Salidas</h3>
                            <select
                                value={filtroMes}
                                onChange={e => setFiltroMes(e.target.value)}
                                className="px-3 py-2 border rounded-lg text-sm"
                            >
                                <option value="todos">Todos los meses</option>
                                {mesesDisponibles.map(m => {
                                    const [anio, mes] = m.split('-');
                                    const nombre = new Date(parseInt(anio), parseInt(mes)-1, 1)
                                        .toLocaleDateString('es', { month: 'long', year: 'numeric' });
                                    return <option key={m} value={m}>{nombre}</option>;
                                })}
                            </select>
                        </div>

                        {salidaFiltradas.length === 0 ? (
                            <div className="text-center py-14 text-gray-400">
                                <div className="text-6xl mb-3">🕊️</div>
                                <p className="font-semibold text-lg">No hay salidas registradas</p>
                                <p className="text-sm mt-1">Registra la primera salida de evangelismo</p>
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {salidaFiltradas.map(salida => {
                                    const abierto = detalleSalidaId === salida.id;
                                    const contactos = salida.contactos || [];
                                    const tieneInteres = contactos.some(c => c.interes);
                                    return (
                                        <div key={salida.id} className="border rounded-xl overflow-hidden">
                                            {/* Cabecera */}
                                            <div
                                                className="flex items-center justify-between p-4 cursor-pointer hover:bg-gray-50 transition-colors"
                                                onClick={() => setDetalleSalidaId(abierto ? null : salida.id)}
                                            >
                                                <div className="flex items-center space-x-4">
                                                    <div className="w-11 h-11 bg-primary rounded-full flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                                                        {contactos.length}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-gray-800">{salida.zona}</p>
                                                        <p className="text-sm text-gray-500">
                                                            {salida.fecha
                                                                ? new Date(salida.fecha + 'T12:00:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                                                                : ''}
                                                            {' · '}{salida.tipo}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center space-x-2 flex-shrink-0">
                                                    {tieneInteres && (
                                                        <span className="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full hidden sm:inline">⭐ Con interés</span>
                                                    )}
                                                    <button
                                                        onClick={e => { e.stopPropagation(); editarSalida(salida); }}
                                                        className="text-blue-400 hover:text-blue-600 p-1"
                                                        title="Editar"
                                                    >✏️</button>
                                                    <button
                                                        onClick={e => { e.stopPropagation(); eliminarSalida(salida.id); }}
                                                        className="text-red-400 hover:text-red-600 p-1"
                                                        title="Eliminar"
                                                    >🗑️</button>
                                                    <span className="text-gray-400 ml-1">{abierto ? '▲' : '▼'}</span>
                                                </div>
                                            </div>

                                            {/* Detalle expandible */}
                                            {abierto && (
                                                <div className="border-t bg-gray-50 p-4 space-y-3">
                                                    {salida.notas && (
                                                        <p className="text-sm text-gray-600 italic bg-white px-3 py-2 rounded-lg border-l-4 border-primary">
                                                            📝 {salida.notas}
                                                        </p>
                                                    )}
                                                    {contactos.length === 0 ? (
                                                        <p className="text-sm text-gray-400 text-center py-4">
                                                            No se registraron contactos en esta salida.
                                                        </p>
                                                    ) : (
                                                        <div className="space-y-2">
                                                            <p className="text-sm font-semibold text-gray-600">
                                                                {contactos.length} contacto{contactos.length !== 1 ? 's' : ''}:
                                                            </p>
                                                            {contactos.map((c, idx) => (
                                                                <div key={idx} className="flex items-center justify-between bg-white px-4 py-3 rounded-lg border">
                                                                    <div className="flex items-center space-x-3">
                                                                        <div className="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-sm font-bold text-gray-600">
                                                                            {c.nombre.charAt(0).toUpperCase()}
                                                                        </div>
                                                                        <div>
                                                                            <p className="font-semibold text-sm text-gray-800">{c.nombre}</p>
                                                                            {c.telefono && (
                                                                                <p className="text-xs text-gray-500">📞 {c.telefono}</p>
                                                                            )}
                                                                        </div>
                                                                        {c.interes && (
                                                                            <span className="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full">⭐ Interesado</span>
                                                                        )}
                                                                    </div>
                                                                    <button
                                                                        onClick={() => convertirAVisitante(c, salida.fecha)}
                                                                        className="text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 px-3 py-1.5 rounded-lg font-semibold transition-colors"
                                                                        title="Registrar como visitante"
                                                                    >
                                                                        + Visitante
                                                                    </button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ModuloEnDesarrollo({ titulo, icono, descripcion }) {
            return (
                <div className="max-w-4xl mx-auto">
                    <h2 className="text-3xl font-bold text-secondary mb-6">{titulo}</h2>
                    <div className="bg-white rounded-lg shadow-md p-8 text-center">
                        <div className="text-6xl mb-4">{icono}</div>
                        <h3 className="text-xl font-bold text-gray-700 mb-2">Módulo en Desarrollo</h3>
                        <p className="text-gray-500">{descripcion}</p>
                        <div className="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                            <p className="text-sm text-blue-700">
                                <strong>🚧 Próximamente:</strong> Este módulo será desarrollado en las siguientes fases del proyecto
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // RENDERIZAR APLICACIÓN
        // ============================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
