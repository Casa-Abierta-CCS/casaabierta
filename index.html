        // ============================================
        // MÓDULO DE ASIGNACIONES
        // ============================================
        function Asignaciones({ userProfile }) {
            const [tab, setTab] = useState('servicios'); // servicios | equipo
            const [servicios, setServicios] = useState([]);
            const [miembros, setMiembros] = useState([]);
            const [mostrarFormServicio, setMostrarFormServicio] = useState(false);
            const [servicioEditando, setServicioEditando] = useState(null);
            const [servicioDetalle, setServicioDetalle] = useState(null);

            const esAdmin = userProfile && (userProfile.rol === 'admin' || userProfile.rol === 'lider');

            // Roles disponibles con su config
            const ROLES = [
                { id: 'predicador', label: 'Predicador / Pastor', icono: '🎤', tipo: 'rotativo', max: 1 },
                { id: 'lider_alabanza', label: 'Líder de Alabanza', icono: '🎵', tipo: 'rotativo', max: 1 },
                { id: 'musicos', label: 'Músicos', icono: '🎸', tipo: 'rotativo', max: 5 },
                { id: 'sonido', label: 'Sonido', icono: '🔊', tipo: 'mixto', max: 2 },
                { id: 'multimedia', label: 'Multimedia / Pantallas', icono: '📽️', tipo: 'mixto', max: 2 },
                { id: 'bienvenida', label: 'Bienvenida', icono: '🤝', tipo: 'rotativo', max: 3 },
                { id: 'logistica', label: 'Logística', icono: '📦', tipo: 'mixto', max: 3 },
                { id: 'ninos', label: 'Escuela / Niños', icono: '👶', tipo: 'rotativo', max: 3 },
            ];

            // Cargar servicios
            useEffect(() => {
                const unsubscribe = db.collection('asignaciones_servicios')
                    .orderBy('fecha', 'desc')
                    .onSnapshot(snap => {
                        setServicios(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => unsubscribe();
            }, []);

            // Cargar miembros registrados
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .onSnapshot(snap => {
                        setMiembros(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                return () => unsubscribe();
            }, []);

            const handleEliminarServicio = async (servicio) => {
                if (!window.confirm(`¿Eliminar el servicio "${servicio.titulo}"?`)) return;
                await db.collection('asignaciones_servicios').doc(servicio.id).delete();
            };

            const proximoServicio = servicios.find(s => new Date(s.fecha) >= new Date(new Date().toDateString()));
            const serviciosPasados = servicios.filter(s => new Date(s.fecha) < new Date(new Date().toDateString()));

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-3xl font-bold text-secondary">👥 Asignaciones</h2>
                        {esAdmin && (
                            <button
                                onClick={() => { setServicioEditando(null); setMostrarFormServicio(true); }}
                                className="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700"
                            >
                                + Nueva Actividad
                            </button>
                        )}
                    </div>

                    {/* Tabs */}
                    <div className="flex border-b">
                        <button onClick={() => setTab('servicios')} className={`px-6 py-3 font-semibold border-b-2 transition-colors ${tab === 'servicios' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                            📋 Servicios
                        </button>
                        <button onClick={() => setTab('equipo')} className={`px-6 py-3 font-semibold border-b-2 transition-colors ${tab === 'equipo' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                            👤 Mi Equipo
                        </button>
                    </div>

                    {/* Tab: Servicios */}
                    {tab === 'servicios' && (
                        <div className="space-y-6">
                            {/* Formulario nuevo/editar */}
                            {mostrarFormServicio && esAdmin && (
                                <FormularioServicio
                                    servicio={servicioEditando}
                                    ROLES={ROLES}
                                    miembros={miembros}
                                    onClose={() => { setMostrarFormServicio(false); setServicioEditando(null); }}
                                />
                            )}

                            {/* Detalle de servicio */}
                            {servicioDetalle && (
                                <DetalleServicio
                                    servicio={servicioDetalle}
                                    ROLES={ROLES}
                                    miembros={miembros}
                                    esAdmin={esAdmin}
                                    onClose={() => setServicioDetalle(null)}
                                    onEditar={(s) => { setServicioEditando(s); setMostrarFormServicio(true); setServicioDetalle(null); }}
                                    onEliminar={handleEliminarServicio}
                                />
                            )}

                            {/* Próximo servicio destacado */}
                            {proximoServicio && !mostrarFormServicio && !servicioDetalle && (
                                <div className="bg-gradient-to-r from-primary to-red-700 text-white rounded-xl p-6 cursor-pointer hover:shadow-xl transition-shadow" onClick={() => setServicioDetalle(proximoServicio)}>
                                    <div className="flex items-start justify-between">
                                        <div>
                                            <p className="text-red-200 text-sm font-semibold uppercase tracking-wide mb-1">📌 Próximo Servicio</p>
                                            <h3 className="text-2xl font-bold mb-1">{proximoServicio.titulo}</h3>
                                            <p className="text-red-100">
                                                📅 {new Date(proximoServicio.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}
                                                {proximoServicio.hora && ` • ⏰ ${proximoServicio.hora}`}
                                            </p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-red-200 text-sm">Asignados</p>
                                            <p className="text-4xl font-bold">
                                                {Object.values(proximoServicio.asignaciones || {}).flat().length}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Preview de roles */}
                                    <div className="mt-4 flex flex-wrap gap-2">
                                        {ROLES.map(rol => {
                                            const asignados = (proximoServicio.asignaciones || {})[rol.id] || [];
                                            return (
                                                <span key={rol.id} className={`px-3 py-1 rounded-full text-sm font-semibold ${asignados.length > 0 ? 'bg-white text-red-700' : 'bg-red-800 text-red-200'}`}>
                                                    {rol.icono} {asignados.length > 0 ? asignados.map(id => miembros.find(m => m.id === id)?.nombre || '?').join(', ') : `${rol.label}: sin asignar`}
                                                </span>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* Lista de servicios */}
                            {!mostrarFormServicio && !servicioDetalle && (
                                <div>
                                    <h3 className="text-lg font-bold text-gray-700 mb-3">Todos los servicios</h3>
                                    {servicios.length === 0 ? (
                                        <div className="text-center py-16 bg-white rounded-xl shadow">
                                            <div className="text-6xl mb-4">📋</div>
                                            <p className="text-xl text-gray-600 font-semibold">No hay servicios creados</p>
                                            <p className="text-gray-400 mt-2">Crea el primer servicio para comenzar a asignar</p>
                                            {esAdmin && (
                                                <button onClick={() => setMostrarFormServicio(true)} className="mt-6 bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700">
                                                    + Crear primera actividad
                                                </button>
                                            )}
                                        </div>
                                    ) : (
                                        <div className="grid gap-3">
                                            {servicios.map(servicio => {
                                                const totalAsignados = Object.values(servicio.asignaciones || {}).flat().length;
                                                const totalRoles = ROLES.length;
                                                const rolesCompletos = ROLES.filter(r => ((servicio.asignaciones || {})[r.id] || []).length > 0).length;
                                                const esPasado = new Date(servicio.fecha) < new Date(new Date().toDateString());
                                                
                                                return (
                                                    <div key={servicio.id} className={`bg-white rounded-xl shadow p-4 flex items-center justify-between hover:shadow-md transition-shadow cursor-pointer border-l-4 ${esPasado ? 'border-gray-300 opacity-70' : 'border-primary'}`} onClick={() => setServicioDetalle(servicio)}>
                                                        <div className="flex items-center space-x-4">
                                                            <div className={`text-3xl`}>{esPasado ? '✅' : '📌'}</div>
                                                            <div>
                                                                <h4 className="font-bold text-secondary">{servicio.titulo}</h4>
                                                                <p className="text-sm text-gray-500">
                                                                    {new Date(servicio.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                                                    {servicio.hora && ` • ${servicio.hora}`}
                                                                </p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center space-x-4">
                                                            <div className="text-right">
                                                                <p className="text-sm text-gray-500">Roles cubiertos</p>
                                                                <p className="font-bold text-lg">{rolesCompletos}/{totalRoles}</p>
                                                            </div>
                                                            <div className="w-12 h-12 rounded-full flex items-center justify-center" style={{ background: `conic-gradient(#DC2626 ${rolesCompletos/totalRoles*360}deg, #e5e7eb 0deg)` }}>
                                                                <div className="w-8 h-8 bg-white rounded-full flex items-center justify-center text-xs font-bold">
                                                                    {Math.round(rolesCompletos/totalRoles*100)}%
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Tab: Mi Equipo */}
                    {tab === 'equipo' && (
                        <TabEquipo miembros={miembros} servicios={servicios} ROLES={ROLES} />
                    )}
                </div>
            );
        }

        // Formulario de nueva/editar actividad
        function FormularioServicio({ servicio, ROLES, miembros, onClose }) {
            const [formData, setFormData] = useState({
                titulo: servicio?.titulo || 'Experiencia Adora',
                fecha: servicio?.fecha || new Date().toISOString().split('T')[0],
                hora: servicio?.hora || '10:00',
                notas: servicio?.notas || '',
                asignaciones: servicio?.asignaciones || {},
                colaboradores: servicio?.colaboradores || {} // { rolId: [{nombre, tarea}] }
            });
            const [saving, setSaving] = useState(false);

            const tiposServicio = ['Experiencia ADORA', 'Open House', 'Escuela Adora', 'Noche de Café', 'Día Especial', 'Retiro', 'Otro'];

            const getNombre = (id) => {
                const m = miembros.find(m => m.id === id);
                return m?.nombre || m?.email || 'Desconocido';
            };

            const handleToggleMiembro = (rolId, miembroId) => {
                const rolActual = formData.asignaciones[rolId] || [];
                const rol = ROLES.find(r => r.id === rolId);
                let nuevos;
                if (rolActual.includes(miembroId)) {
                    nuevos = rolActual.filter(id => id !== miembroId);
                } else {
                    if (rolActual.length >= rol.max) {
                        alert(`Este rol acepta máximo ${rol.max} persona(s)`);
                        return;
                    }
                    nuevos = [...rolActual, miembroId];
                }
                setFormData({ ...formData, asignaciones: { ...formData.asignaciones, [rolId]: nuevos } });
            };

            const handleAgregarColaborador = (rolId) => {
                const nombre = prompt('Nombre del colaborador:');
                if (!nombre?.trim()) return;
                const tarea = prompt(`Tarea de ${nombre.trim()}:`);
                const colab = { nombre: nombre.trim(), tarea: tarea?.trim() || '' };
                const actuales = formData.colaboradores[rolId] || [];
                setFormData({ ...formData, colaboradores: { ...formData.colaboradores, [rolId]: [...actuales, colab] } });
            };

            const handleEliminarColaborador = (rolId, idx) => {
                const actuales = [...(formData.colaboradores[rolId] || [])];
                actuales.splice(idx, 1);
                setFormData({ ...formData, colaboradores: { ...formData.colaboradores, [rolId]: actuales } });
            };

            const handleGuardar = async () => {
                if (!formData.titulo || !formData.fecha) {
                    alert('El título y la fecha son obligatorios');
                    return;
                }
                setSaving(true);
                try {
                    const data = { ...formData, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
                    if (servicio) {
                        await db.collection('asignaciones_servicios').doc(servicio.id).update(data);
                    } else {
                        await db.collection('asignaciones_servicios').add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                    }
                    onClose();
                } catch (e) {
                    alert('Error al guardar');
                }
                setSaving(false);
            };

            return (
                <div className="bg-white rounded-xl shadow-lg p-6 border-2 border-primary">
                    <div className="flex items-center justify-between mb-6">
                        <h3 className="text-xl font-bold text-secondary">{servicio ? '✏️ Editar Actividad' : '+ Nueva Actividad'}</h3>
                        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl">✕</button>
                    </div>

                    {/* Datos de la actividad */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Tipo de actividad *</label>
                            <select value={formData.titulo} onChange={e => setFormData({...formData, titulo: e.target.value})} className="w-full px-3 py-2 border rounded-lg">
                                {tiposServicio.map(t => <option key={t} value={t}>{t}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Fecha *</label>
                            <input type="date" value={formData.fecha} onChange={e => setFormData({...formData, fecha: e.target.value})} className="w-full px-3 py-2 border rounded-lg" />
                        </div>
                        <div>
                            <label className="block font-semibold mb-2 text-sm">Hora</label>
                            <input type="time" value={formData.hora} onChange={e => setFormData({...formData, hora: e.target.value})} className="w-full px-3 py-2 border rounded-lg" />
                        </div>
                    </div>

                    {/* Asignación de roles */}
                    <div className="space-y-4 mb-6">
                        <h4 className="font-bold text-gray-800">Asignar personas por área:</h4>
                        {ROLES.map(rol => {
                            const asignados = formData.asignaciones[rol.id] || [];
                            const colaboradores = formData.colaboradores[rol.id] || [];
                            return (
                                <div key={rol.id} className="border rounded-lg p-4">
                                    <div className="flex items-center justify-between mb-3">
                                        <div className="flex items-center space-x-2">
                                            <span className="text-2xl">{rol.icono}</span>
                                            <span className="font-semibold">{rol.label}</span>
                                        </div>
                                        <span className={`text-xs px-2 py-1 rounded-full font-semibold ${asignados.length + colaboradores.length > 0 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                                            {asignados.length + colaboradores.length} persona(s)
                                        </span>
                                    </div>

                                    {/* Miembros registrados */}
                                    {miembros.length > 0 && (
                                        <div className="mb-3">
                                            <p className="text-xs text-gray-500 mb-2 font-semibold">👤 Equipo registrado:</p>
                                            <div className="flex flex-wrap gap-2">
                                                {miembros.map(m => {
                                                    const sel = asignados.includes(m.id);
                                                    return (
                                                        <button key={m.id} onClick={() => handleToggleMiembro(rol.id, m.id)}
                                                            className={`px-3 py-1.5 rounded-full text-sm font-semibold transition-all ${sel ? 'bg-primary text-white shadow-md' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                                            {sel ? '✓ ' : ''}{m.nombre || m.email}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {/* Colaboradores externos */}
                                    <div>
                                        <p className="text-xs text-gray-500 mb-2 font-semibold">🤝 Colaboradores adicionales:</p>
                                        <div className="space-y-2 mb-2">
                                            {colaboradores.map((c, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-lg px-3 py-2">
                                                    <div>
                                                        <span className="font-semibold text-blue-800 text-sm">{c.nombre}</span>
                                                        {c.tarea && <span className="text-blue-600 text-sm"> → {c.tarea}</span>}
                                                    </div>
                                                    <button onClick={() => handleEliminarColaborador(rol.id, idx)} className="text-red-400 hover:text-red-600 text-lg ml-2">✕</button>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => handleAgregarColaborador(rol.id)}
                                            className="text-sm text-blue-600 hover:text-blue-800 font-semibold border border-blue-300 px-3 py-1 rounded-lg hover:bg-blue-50">
                                            + Agregar colaborador
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Notas */}
                    <div className="mb-6">
                        <label className="block font-semibold mb-2 text-sm">Notas adicionales</label>
                        <textarea value={formData.notas} onChange={e => setFormData({...formData, notas: e.target.value})} rows="2" className="w-full px-3 py-2 border rounded-lg" placeholder="Instrucciones especiales, tema del mensaje, etc." />
                    </div>

                    <div className="flex space-x-3">
                        <button onClick={handleGuardar} disabled={saving} className="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">
                            {saving ? 'Guardando...' : '✓ Guardar Actividad'}
                        </button>
                        <button onClick={onClose} className="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-300">
                            ✕ Cancelar
                        </button>
                    </div>
                </div>
            );
        }

        // Vista detalle de una actividad
        function DetalleServicio({ servicio, ROLES, miembros, esAdmin, onClose, onEditar, onEliminar }) {
            const getNombre = (id) => {
                const m = miembros.find(m => m.id === id);
                return m?.nombre || m?.email || 'Desconocido';
            };

            const handleCompartir = () => {
                let texto = `📋 *ASIGNACIONES - CASA ABIERTA*\n`;
                texto += `📌 *${servicio.titulo}*\n`;
                texto += `📅 ${new Date(servicio.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}`;
                if (servicio.hora) texto += ` • ⏰ ${servicio.hora}`;
                texto += `\n\n`;

                ROLES.forEach(rol => {
                    const asignados = (servicio.asignaciones || {})[rol.id] || [];
                    const colaboradores = (servicio.colaboradores || {})[rol.id] || [];
                    const hayAlguien = asignados.length > 0 || colaboradores.length > 0;

                    texto += `${rol.icono} *${rol.label}:*\n`;
                    if (!hayAlguien) {
                        texto += `   _Sin asignar_\n`;
                    } else {
                        asignados.forEach(id => { texto += `   • ${getNombre(id)}\n`; });
                        colaboradores.forEach(c => { texto += `   • ${c.nombre}${c.tarea ? ` → ${c.tarea}` : ''}\n`; });
                    }
                });

                if (servicio.notas) texto += `\n📝 *Notas:* ${servicio.notas}`;

                if (navigator.share) {
                    navigator.share({ title: `Asignaciones ${servicio.titulo}`, text: texto }).catch(() => {
                        navigator.clipboard.writeText(texto);
                        alert('✓ Copiado al portapapeles');
                    });
                } else {
                    navigator.clipboard.writeText(texto);
                    alert('✓ Copiado al portapapeles\n\nPuedes pegarlo en WhatsApp');
                }
            };

            const totalAsignados = Object.values(servicio.asignaciones || {}).flat().length +
                Object.values(servicio.colaboradores || {}).flat().length;
            const rolesCompletos = ROLES.filter(r => {
                const a = ((servicio.asignaciones || {})[r.id] || []).length;
                const c = ((servicio.colaboradores || {})[r.id] || []).length;
                return a + c > 0;
            }).length;

            return (
                <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                    {/* Header */}
                    <div className="bg-gradient-to-r from-secondary to-gray-800 text-white p-6">
                        <div className="flex items-start justify-between">
                            <div>
                                <h3 className="text-2xl font-bold">{servicio.titulo}</h3>
                                <p className="text-gray-300 mt-1">
                                    📅 {new Date(servicio.fecha + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                    {servicio.hora && ` • ⏰ ${servicio.hora}`}
                                </p>
                            </div>
                            <button onClick={onClose} className="text-gray-300 hover:text-white text-2xl">✕</button>
                        </div>
                        <div className="flex items-center space-x-6 mt-4">
                            <div className="text-center">
                                <p className="text-3xl font-bold">{totalAsignados}</p>
                                <p className="text-gray-300 text-sm">personas</p>
                            </div>
                            <div className="text-center">
                                <p className="text-3xl font-bold">{rolesCompletos}/{ROLES.length}</p>
                                <p className="text-gray-300 text-sm">áreas cubiertas</p>
                            </div>
                        </div>
                    </div>

                    {/* Roles */}
                    <div className="p-6 space-y-3">
                        {ROLES.map(rol => {
                            const asignados = (servicio.asignaciones || {})[rol.id] || [];
                            const colaboradores = (servicio.colaboradores || {})[rol.id] || [];
                            const hayAlguien = asignados.length > 0 || colaboradores.length > 0;

                            return (
                                <div key={rol.id} className={`p-4 rounded-lg border ${hayAlguien ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                    <div className="flex items-start justify-between">
                                        <div className="flex items-center space-x-2 mb-2">
                                            <span className="text-xl">{rol.icono}</span>
                                            <span className="font-semibold text-gray-800">{rol.label}</span>
                                        </div>
                                        {!hayAlguien && <span className="text-red-500 text-sm font-semibold">⚠️ Sin asignar</span>}
                                    </div>

                                    {hayAlguien && (
                                        <div className="space-y-1 pl-8">
                                            {/* Equipo registrado */}
                                            {asignados.map(id => (
                                                <div key={id} className="flex items-center space-x-2">
                                                    <span className="w-2 h-2 bg-green-500 rounded-full"></span>
                                                    <span className="text-sm font-semibold text-gray-800">{getNombre(id)}</span>
                                                    <span className="text-xs text-gray-400">(equipo)</span>
                                                </div>
                                            ))}
                                            {/* Colaboradores externos */}
                                            {colaboradores.map((c, idx) => (
                                                <div key={idx} className="flex items-center space-x-2">
                                                    <span className="w-2 h-2 bg-blue-400 rounded-full"></span>
                                                    <span className="text-sm font-semibold text-gray-800">{c.nombre}</span>
                                                    {c.tarea && <span className="text-sm text-blue-600">→ {c.tarea}</span>}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        {servicio.notas && (
                            <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                                <p className="font-semibold text-yellow-800 mb-1">📝 Notas:</p>
                                <p className="text-yellow-700">{servicio.notas}</p>
                            </div>
                        )}
                    </div>

                    {/* Botones */}
                    <div className="px-6 pb-6 flex flex-wrap gap-3">
                        <button onClick={handleCompartir} className="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">
                            📱 Compartir por WhatsApp
                        </button>
                        {esAdmin && (
                            <>
                                <button onClick={() => onEditar(servicio)} className="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
                                    ✏️ Editar
                                </button>
                                <button onClick={() => { onEliminar(servicio); onClose(); }} className="bg-red-100 text-red-700 px-4 py-3 rounded-lg font-bold hover:bg-red-200">
                                    🗑️
                                </button>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // Tab Mi Equipo - quién hace qué
        function TabEquipo({ miembros, servicios, ROLES }) {
            const proximosServicios = servicios.filter(s => new Date(s.fecha) >= new Date(new Date().toDateString())).slice(0, 5);

            return (
                <div className="space-y-6">
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                        <p className="text-blue-800 font-semibold">👥 Vista del equipo — próximos {proximosServicios.length} servicios</p>
                    </div>

                    {miembros.length === 0 ? (
                        <div className="text-center py-12 bg-white rounded-xl shadow">
                            <div className="text-6xl mb-4">👤</div>
                            <p className="text-xl text-gray-600">No hay miembros del equipo aún</p>
                            <p className="text-gray-400 mt-2">Los líderes aparecerán aquí cuando se registren en la app</p>
                        </div>
                    ) : (
                        <div className="grid gap-4">
                            {miembros.map(miembro => {
                                // Buscar asignaciones de este miembro en próximos servicios
                                const misAsignaciones = proximosServicios.map(servicio => {
                                    const misRoles = ROLES.filter(rol => ((servicio.asignaciones || {})[rol.id] || []).includes(miembro.id));
                                    return misRoles.length > 0 ? { servicio, roles: misRoles } : null;
                                }).filter(Boolean);

                                return (
                                    <div key={miembro.id} className="bg-white rounded-xl shadow p-5">
                                        <div className="flex items-center space-x-4 mb-4">
                                            <div className="w-12 h-12 bg-primary rounded-full flex items-center justify-center text-white font-bold text-lg">
                                                {(miembro.nombre || miembro.email || '?')[0].toUpperCase()}
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-secondary text-lg">{miembro.nombre || miembro.email}</h4>
                                                <p className="text-sm text-gray-500">{miembro.departamento || 'Sin departamento'}</p>
                                            </div>
                                        </div>

                                        {misAsignaciones.length === 0 ? (
                                            <p className="text-gray-400 text-sm italic">Sin asignaciones en próximos servicios</p>
                                        ) : (
                                            <div className="space-y-2">
                                                {misAsignaciones.map(({ servicio, roles }) => (
                                                    <div key={servicio.id} className="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-2">
                                                        <div>
                                                            <p className="font-semibold text-sm">{servicio.titulo}</p>
                                                            <p className="text-xs text-gray-500">
                                                                {new Date(servicio.fecha + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })}
                                                            </p>
                                                        </div>
                                                        <div className="flex gap-1 flex-wrap justify-end">
                                                            {roles.map(r => (
                                                                <span key={r.id} className="bg-primary text-white text-xs px-2 py-1 rounded-full">
                                                                    {r.icono} {r.label}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        // ============================================
        // MÓDULO DE GESTIÓN DE USUARIOS
        // ============================================
        function GestionUsuarios({ userProfile }) {
            const [usuarios, setUsuarios] = useState([]);
            const [loading, setLoading] = useState(true);
            const [editando, setEditando] = useState(null);

            // Verificar si es admin
            const esAdmin = userProfile && userProfile.rol === 'admin';

            // Cargar todos los usuarios
            useEffect(() => {
                const unsubscribe = db.collection('users')
                    .orderBy('email', 'asc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setUsuarios(data);
                        setLoading(false);
                    });

                return () => unsubscribe();
            }, []);

            const handleCambiarRol = async (usuario, nuevoRol, nuevoDepartamento, nuevoNombre) => {
                if (!esAdmin) {
                    alert('⛔ Solo los administradores pueden cambiar roles');
                    return;
                }

                try {
                    const update = {
                        rol: nuevoRol,
                        departamento: nuevoDepartamento,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    if (nuevoNombre?.trim()) update.nombre = nuevoNombre.trim();

                    await db.collection('users').doc(usuario.id).update(update);
                    alert(`✓ Usuario actualizado correctamente`);
                    setEditando(null);
                } catch (error) {
                    console.error('Error:', error);
                    alert('Error al actualizar el usuario');
                }
            };

            if (!esAdmin) {
                return (
                    <div className="max-w-4xl mx-auto">
                        <h2 className="text-3xl font-bold text-secondary mb-6">👤 Gestión de Usuarios</h2>
                        <div className="bg-red-50 border border-red-300 rounded-lg p-8 text-center">
                            <div className="text-6xl mb-4">🔒</div>
                            <h3 className="text-2xl font-bold text-red-800 mb-2">Acceso Restringido</h3>
                            <p className="text-red-700">
                                Solo los administradores pueden gestionar usuarios.
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-3xl font-bold text-secondary">👤 Gestión de Usuarios</h2>
                        <div className="bg-green-50 border border-green-300 rounded-lg px-4 py-2">
                            <p className="text-sm text-green-800 font-semibold">
                                🔑 Modo Administrador
                            </p>
                        </div>
                    </div>

                    {/* Información de roles */}
                    <div className="bg-blue-50 border border-blue-300 rounded-lg p-4">
                        <h3 className="font-bold text-blue-900 mb-2">ℹ️ Tipos de Roles:</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-blue-800">
                            <div>• <strong>Admin:</strong> Acceso total al sistema</div>
                            <div>• <strong>Editor Inventario:</strong> Puede gestionar inventario</div>
                            <div>• <strong>Líder:</strong> Puede registrar asistencias</div>
                            <div>• <strong>Usuario:</strong> Solo lectura</div>
                        </div>
                    </div>

                    {/* Estadísticas rápidas */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="bg-white rounded-lg shadow p-4 border-l-4 border-red-500">
                            <p className="text-sm text-gray-600">Administradores</p>
                            <p className="text-3xl font-bold text-red-600">
                                {usuarios.filter(u => u.rol === 'admin').length}
                            </p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4 border-l-4 border-blue-500">
                            <p className="text-sm text-gray-600">Logística</p>
                            <p className="text-3xl font-bold text-blue-600">
                                {usuarios.filter(u => u.departamento === 'Logística').length}
                            </p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4 border-l-4 border-green-500">
                            <p className="text-sm text-gray-600">Líderes</p>
                            <p className="text-3xl font-bold text-green-600">
                                {usuarios.filter(u => u.rol === 'lider').length}
                            </p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-4 border-l-4 border-gray-500">
                            <p className="text-sm text-gray-600">Usuarios</p>
                            <p className="text-3xl font-bold text-gray-600">
                                {usuarios.filter(u => u.rol === 'usuario').length}
                            </p>
                        </div>
                    </div>

                    {/* Lista de usuarios */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <h3 className="text-xl font-bold text-secondary mb-4">
                            Usuarios Registrados ({usuarios.length})
                        </h3>

                        {loading ? (
                            <div className="text-center py-8">
                                <div className="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-primary mx-auto"></div>
                                <p className="mt-4 text-gray-600">Cargando usuarios...</p>
                            </div>
                        ) : usuarios.length === 0 ? (
                            <div className="text-center py-8 text-gray-500">
                                No hay usuarios registrados
                            </div>
                        ) : (
                            <div className="space-y-3">
                                {usuarios.map(usuario => (
                                    <TarjetaUsuario
                                        key={usuario.id}
                                        usuario={usuario}
                                        editando={editando}
                                        setEditando={setEditando}
                                        handleCambiarRol={handleCambiarRol}
                                        esAdmin={esAdmin}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Componente: Tarjeta de Usuario
        function TarjetaUsuario({ usuario, editando, setEditando, handleCambiarRol, esAdmin }) {
            const [nuevoRol, setNuevoRol] = useState(usuario.rol || 'usuario');
            const [nuevoDepartamento, setNuevoDepartamento] = useState(usuario.departamento || 'General');
            const [nuevoNombre, setNuevoNombre] = useState(usuario.nombre || '');

            const rolesDisponibles = [
                { value: 'admin', label: '👑 Administrador', color: 'red' },
                { value: 'editor_inventario', label: '📦 Editor Inventario', color: 'blue' },
                { value: 'lider', label: '👥 Líder', color: 'green' },
                { value: 'usuario', label: '👁️ Usuario (Solo lectura)', color: 'gray' }
            ];

            const departamentos = [
                'Administración',
                'Logística',
                'Liderazgo',
                'Alabanza',
                'Multimedia',
                'Niños',
                'General'
            ];

            const colorRol = {
                'admin': 'bg-red-50 border-l-4 border-red-500',
                'editor_inventario': 'bg-blue-50 border-l-4 border-blue-500',
                'lider': 'bg-green-50 border-l-4 border-green-500',
                'usuario': 'bg-gray-50 border-l-4 border-gray-500'
            };

            const labelRol = {
                'admin': '👑 Administrador',
                'editor_inventario': '📦 Editor Inventario',
                'lider': '👥 Líder',
                'usuario': '👁️ Usuario'
            };

            const estaEditando = editando === usuario.id;

            return (
                <div className={`p-4 rounded-lg ${colorRol[usuario.rol] || 'bg-gray-50 border-l-4 border-gray-500'}`}>
                    <div className="flex items-start justify-between">
                        <div className="flex-1">
                            <div className="flex items-center space-x-3 mb-2">
                                <h4 className="font-bold text-lg">{usuario.nombre || usuario.email}</h4>
                                <span className="text-xs bg-white px-2 py-1 rounded-full font-semibold">
                                    {labelRol[usuario.rol] || usuario.rol}
                                </span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-sm text-gray-700">
                                <div>
                                    <span className="text-gray-600">📧 Email:</span>
                                    <span className="ml-2 font-medium">{usuario.email}</span>
                                </div>
                                <div>
                                    <span className="text-gray-600">🏢 Departamento:</span>
                                    <span className="ml-2 font-medium">{usuario.departamento || 'General'}</span>
                                </div>
                                {usuario.createdAt && (
                                    <div>
                                        <span className="text-gray-600">📅 Registrado:</span>
                                        <span className="ml-2">
                                            {new Date(usuario.createdAt.toDate()).toLocaleDateString('es-ES')}
                                        </span>
                                    </div>
                                )}
                            </div>

                            {/* Formulario de edición */}
                            {estaEditando && (
                                <div className="mt-4 bg-white rounded-lg p-4 border-2 border-gray-300">
                                    <h5 className="font-bold mb-3">Editar Usuario</h5>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="md:col-span-2">
                                            <label className="block text-sm font-semibold mb-2">Nombre completo</label>
                                            <input
                                                type="text"
                                                value={nuevoNombre}
                                                onChange={(e) => setNuevoNombre(e.target.value)}
                                                className="w-full px-4 py-2 border rounded-lg"
                                                placeholder="Ej: Jesús García"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Rol</label>
                                            <select
                                                value={nuevoRol}
                                                onChange={(e) => setNuevoRol(e.target.value)}
                                                className="w-full px-4 py-2 border rounded-lg"
                                            >
                                                {rolesDisponibles.map(rol => (
                                                    <option key={rol.value} value={rol.value}>
                                                        {rol.label}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Departamento</label>
                                            <select
                                                value={nuevoDepartamento}
                                                onChange={(e) => setNuevoDepartamento(e.target.value)}
                                                className="w-full px-4 py-2 border rounded-lg"
                                            >
                                                {departamentos.map(dept => (
                                                    <option key={dept} value={dept}>{dept}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex space-x-2 mt-4">
                                        <button
                                            onClick={() => handleCambiarRol(usuario, nuevoRol, nuevoDepartamento, nuevoNombre)}
                                            className="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700"
                                        >
                                            ✓ Guardar Cambios
                                        </button>
                                        <button
                                            onClick={() => setEditando(null)}
                                            className="flex-1 bg-gray-500 text-white py-2 rounded-lg font-semibold hover:bg-gray-600"
                                        >
                                            ✕ Cancelar
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Botón de editar */}
                        {esAdmin && !estaEditando && (
                            <button
                                onClick={() => setEditando(usuario.id)}
                                className="ml-4 bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700"
                            >
                                ✏️ Cambiar Rol
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // PLACEHOLDERS PARA OTROS MÓDULOS
        // ============================================
        // ============================================
        // MÓDULO ESCUELA ADORA
        // ============================================
        function EscuelaAdora({ userProfile }) {
            const [estudiantes, setEstudiantes] = useState([]);
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('general');
            const [mostrarForm, setMostrarForm] = useState(false);
            const [estudianteEditando, setEstudianteEditando] = useState(null);
            const [nivelFiltro, setNivelFiltro] = useState('todos');
            const [busqueda, setBusqueda] = useState('');
            const [estudianteProgreso, setEstudianteProgreso] = useState(null); // para vista detallada

            const esAdmin = userProfile && (
                userProfile.rol === 'admin' ||
                userProfile.departamento === 'Escuela Adora' ||
                userProfile.rol === 'lider'
            );

            const NIVELES = [
                { id: 1, nombre: 'Amo a Dios',          romano: 'I',   color: 'from-yellow-500 to-orange-500', bg: 'bg-orange-50', border: 'border-orange-300', texto: 'text-orange-700', icono: '❤️' },
                { id: 2, nombre: 'Disciplino mi Vida',   romano: 'II',  color: 'from-blue-500 to-indigo-600',   bg: 'bg-blue-50',   border: 'border-blue-300',   texto: 'text-blue-700',   icono: '📖' },
                { id: 3, nombre: 'Ofrezco lo Mejor',     romano: 'III', color: 'from-green-500 to-teal-600',    bg: 'bg-green-50',  border: 'border-green-300',  texto: 'text-green-700',  icono: '🌟' },
                { id: 4, nombre: 'Represento a Jesús',   romano: 'IV',  color: 'from-purple-500 to-violet-600', bg: 'bg-purple-50', border: 'border-purple-300', texto: 'text-purple-700', icono: '✝️' },
                { id: 5, nombre: 'Amo a las Personas',   romano: 'V',   color: 'from-pink-500 to-rose-600',     bg: 'bg-pink-50',   border: 'border-pink-300',   texto: 'text-pink-700',   icono: '🤝' },
            ];

            useEffect(() => {
                const unsubscribe = db.collection('escuela_adora_estudiantes')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snap => {
                        setEstudiantes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setLoading(false);
                    });
                return () => unsubscribe();
            }, []);

            const handleEliminar = async (id) => {
                if (!window.confirm('¿Eliminar este estudiante?')) return;
                await db.collection('escuela_adora_estudiantes').doc(id).delete();
            };

            const estudiantesFiltrados = estudiantes.filter(e => {
                const coincideNivel = nivelFiltro === 'todos' || e.nivelActual === parseInt(nivelFiltro);
                const coincideBusqueda = !busqueda ||
                    e.nombre?.toLowerCase().includes(busqueda.toLowerCase()) ||
                    e.apellido?.toLowerCase().includes(busqueda.toLowerCase());
                return coincideNivel && coincideBusqueda;
            });

            const totalInscritos = estudiantes.length;
            const totalCompletados = estudiantes.filter(e => e.completado).length;
            const enNivelV = estudiantes.filter(e => e.nivelActual === 5).length;

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="bg-gradient-to-r from-gray-900 to-gray-800 text-white rounded-2xl p-6">
                        <div className="flex items-center justify-between">
                            <div>
                                <h2 className="text-3xl font-bold">🎓 Escuela ADORA</h2>
                                <p className="text-gray-300 mt-1">Un camino de discipulado cristiano en 5 niveles</p>
                                <p className="text-gray-400 text-sm mt-1">Líder: Angely</p>
                            </div>
                            {esAdmin && !mostrarForm && (
                                <button onClick={() => { setEstudianteEditando(null); setMostrarForm(true); }}
                                    className="bg-white text-gray-900 px-5 py-2.5 rounded-lg font-bold hover:bg-gray-100">
                                    + Inscribir Estudiante
                                </button>
                            )}
                        </div>
                    </div>

                    {mostrarForm && esAdmin && (
                        <FormularioEstudiante
                            estudiante={estudianteEditando}
                            NIVELES={NIVELES}
                            userProfile={userProfile}
                            onClose={() => { setMostrarForm(false); setEstudianteEditando(null); }}
                        />
                    )}

                    {estudianteProgreso && !mostrarForm && (
                        <ProgresoDetalladoEstudiante
                            estudiante={estudianteProgreso}
                            NIVELES={NIVELES}
                            esAdmin={esAdmin}
                            onClose={() => setEstudianteProgreso(null)}
                            onGuardar={(updated) => {
                                setEstudiantes(prev => prev.map(e => e.id === updated.id ? updated : e));
                                setEstudianteProgreso(updated);
                            }}
                        />
                    )}

                    <div className="grid grid-cols-3 gap-4">
                        <div className="bg-white rounded-xl shadow p-5 text-center border-t-4 border-gray-800">
                            <p className="text-4xl font-bold text-secondary">{totalInscritos}</p>
                            <p className="text-gray-600 font-semibold mt-1">📋 Total inscritos</p>
                        </div>
                        <div className="bg-white rounded-xl shadow p-5 text-center border-t-4 border-green-500">
                            <p className="text-4xl font-bold text-green-600">{totalCompletados}</p>
                            <p className="text-gray-600 font-semibold mt-1">🏆 Completaron todo</p>
                        </div>
                        <div className="bg-white rounded-xl shadow p-5 text-center border-t-4 border-pink-500">
                            <p className="text-4xl font-bold text-pink-600">{enNivelV}</p>
                            <p className="text-gray-600 font-semibold mt-1">🤝 En Nivel V</p>
                        </div>
                    </div>

                    <div className="flex border-b">
                        {[['general','📊 Vista por Niveles'],['estudiantes','👤 Todos los Estudiantes']].map(([id, label]) => (
                            <button key={id} onClick={() => setTab(id)}
                                className={`px-6 py-3 font-semibold border-b-2 transition-colors ${tab === id ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'}`}>
                                {label}
                            </button>
                        ))}
                    </div>

                    {tab === 'general' && (
                        <div className="space-y-4">
                            {NIVELES.map(nivel => {
                                const enEsteNivel = estudiantes.filter(e => e.nivelActual === nivel.id);
                                const completados = enEsteNivel.filter(e => e.completado);
                                const enProgreso = enEsteNivel.filter(e => !e.completado);
                                return (
                                    <div key={nivel.id} className={`bg-white rounded-xl shadow overflow-hidden border ${nivel.border}`}>
                                        <div className={`bg-gradient-to-r ${nivel.color} text-white px-6 py-4`}>
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center space-x-3">
                                                    <span className="text-3xl">{nivel.icono}</span>
                                                    <div>
                                                        <p className="text-white/80 text-sm font-semibold uppercase tracking-wider">Nivel {nivel.romano}</p>
                                                        <h3 className="text-xl font-bold">{nivel.nombre}</h3>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <p className="text-4xl font-bold">{enEsteNivel.length}</p>
                                                    <p className="text-white/80 text-sm">estudiante{enEsteNivel.length !== 1 ? 's' : ''}</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="p-4">
                                            {enEsteNivel.length === 0 ? (
                                                <p className="text-gray-400 italic text-center py-3">Sin estudiantes en este nivel</p>
                                            ) : (
                                                <div className="space-y-3">
                                                    {enProgreso.length > 0 && (
                                                        <div>
                                                            <p className="text-xs font-bold text-gray-500 uppercase mb-2">⏳ En progreso ({enProgreso.length})</p>
                                                            <div className="flex flex-wrap gap-2">
                                                                {enProgreso.map(e => (
                                                                    <TarjetaMiniEstudiante key={e.id} estudiante={e} nivel={nivel} esAdmin={esAdmin} NIVELES={NIVELES}
                                                                        onEditar={() => { setEstudianteEditando(e); setMostrarForm(true); }}
                                                                        onEliminar={handleEliminar}
                                                                        onVerProgreso={() => setEstudianteProgreso(e)} />
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                    {completados.length > 0 && (
                                                        <div>
                                                            <p className="text-xs font-bold text-gray-500 uppercase mb-2">✅ Completados ({completados.length})</p>
                                                            <div className="flex flex-wrap gap-2">
                                                                {completados.map(e => (
                                                                    <TarjetaMiniEstudiante key={e.id} estudiante={e} nivel={nivel} esAdmin={esAdmin} NIVELES={NIVELES}
                                                                        onEditar={() => { setEstudianteEditando(e); setMostrarForm(true); }}
                                                                        onEliminar={handleEliminar}
                                                                        onVerProgreso={() => setEstudianteProgreso(e)} />
                                                                ))}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {tab === 'estudiantes' && (
                        <div className="space-y-4">
                            <div className="flex flex-wrap gap-3">
                                <input type="text" placeholder="🔍 Buscar estudiante..." value={busqueda}
                                    onChange={e => setBusqueda(e.target.value)}
                                    className="flex-1 min-w-48 px-4 py-2 border rounded-lg" />
                                <select value={nivelFiltro} onChange={e => setNivelFiltro(e.target.value)}
                                    className="px-4 py-2 border rounded-lg font-semibold">
                                    <option value="todos">Todos los niveles</option>
                                    {NIVELES.map(n => <option key={n.id} value={n.id}>{n.icono} Nivel {n.romano} — {n.nombre}</option>)}
                                </select>
                            </div>
                            {estudiantesFiltrados.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-xl shadow">
                                    <div className="text-6xl mb-4">🎓</div>
                                    <p className="text-xl text-gray-500">{estudiantes.length === 0 ? 'No hay estudiantes inscritos aún' : 'No se encontraron resultados'}</p>
                                </div>
                            ) : (
                                <div className="bg-white rounded-xl shadow overflow-hidden">
                                    <table className="w-full">
                                        <thead className="bg-gray-50 border-b">
                                            <tr>
                                                <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Estudiante</th>
                                                <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Nivel actual</th>
                                                <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Progreso</th>
                                                <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Inicio</th>
                                                <th className="text-left px-5 py-3 text-sm font-semibold text-gray-600">Estado</th>
                                                {esAdmin && <th className="px-5 py-3"></th>}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {estudiantesFiltrados.map(e => {
                                                const nivel = NIVELES.find(n => n.id === e.nivelActual) || NIVELES[0];
                                                return (
                                                    <tr key={e.id} className="hover:bg-gray-50">
                                                        <td className="px-5 py-4">
                                                            <div className="flex items-center space-x-3">
                                                                <div className={`w-10 h-10 rounded-full bg-gradient-to-br ${nivel.color} flex items-center justify-center text-white font-bold`}>
                                                                    {(e.nombre || '?')[0].toUpperCase()}
                                                                </div>
                                                                <div>
                                                                    <p className="font-bold text-secondary">{e.nombre} {e.apellido}</p>
                                                                    {e.telefono && <p className="text-xs text-gray-400">{e.telefono}</p>}
                                                                </div>
                                                            </div>
                                                        </td>
                                                        <td className="px-5 py-4">
                                                            <span className={`px-3 py-1 rounded-full text-sm font-bold ${nivel.bg} ${nivel.texto} border ${nivel.border}`}>
                                                                {nivel.icono} {nivel.romano} — {nivel.nombre}
                                                            </span>
                                                        </td>
                                                        <td className="px-5 py-4 w-32">
                                                            <BarraProgreso nivelActual={e.nivelActual} completado={e.completado} NIVELES={NIVELES} />
                                                        </td>
                                                        <td className="px-5 py-4 text-sm text-gray-500">
                                                            {e.fechaInicio ? new Date(e.fechaInicio + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}
                                                        </td>
                                                        <td className="px-5 py-4">
                                                            {e.completado
                                                                ? <span className="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-bold">🏆 Completado</span>
                                                                : <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-xs font-bold">⏳ En progreso</span>}
                                                        </td>
                                                        {esAdmin && (
                                                            <td className="px-5 py-4">
                                                                <div className="flex space-x-1">
                                                                    <button onClick={() => setEstudianteProgreso(e)}
                                                                        className="text-green-600 hover:bg-green-50 px-2 py-1 rounded font-semibold text-sm" title="Ver progreso">📊</button>
                                                                    <button onClick={() => { setEstudianteEditando(e); setMostrarForm(true); setTab('general'); }}
                                                                        className="text-blue-500 hover:bg-blue-50 px-2 py-1 rounded">✏️</button>
                                                                    <button onClick={() => handleEliminar(e.id)}
                                                                        className="text-red-400 hover:bg-red-50 px-2 py-1 rounded">🗑️</button>
                                                                </div>
                                                            </td>
                                                        )}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function BarraProgreso({ nivelActual, completado, NIVELES }) {
            return (
                <div className="flex space-x-1">
                    {NIVELES.map(n => (
                        <div key={n.id} className={`h-2 flex-1 rounded-full ${
                            completado && n.id === nivelActual ? 'bg-green-500' :
                            n.id < nivelActual ? 'bg-green-400' :
                            n.id === nivelActual ? 'bg-yellow-400' : 'bg-gray-200'}`}
                            title={`${n.icono} ${n.nombre}`}></div>
                    ))}
                </div>
            );
        }

        function TarjetaMiniEstudiante({ estudiante, nivel, esAdmin, NIVELES, onEditar, onEliminar, onVerProgreso }) {
            const [tooltip, setTooltip] = useState(false);
            return (
                <div className="relative">
                    <div onClick={() => setTooltip(!tooltip)}
                        className={`flex items-center space-x-2 px-3 py-2 rounded-lg border cursor-pointer hover:shadow-md transition-all ${estudiante.completado ? 'bg-green-50 border-green-300' : `${nivel.bg} ${nivel.border}`}`}>
                        <div className={`w-7 h-7 rounded-full bg-gradient-to-br ${nivel.color} flex items-center justify-center text-white text-xs font-bold`}>
                            {(estudiante.nombre || '?')[0].toUpperCase()}
                        </div>
                        <span className={`text-sm font-semibold ${nivel.texto}`}>{estudiante.nombre} {estudiante.apellido}</span>
                        {estudiante.completado && <span className="text-green-500 text-xs">✓</span>}
                    </div>
                    {tooltip && (
                        <div className="absolute top-full left-0 mt-1 z-50 bg-white rounded-xl shadow-xl border p-4 min-w-64">
                            <div className="flex items-start justify-between mb-3">
                                <div>
                                    <p className="font-bold text-secondary">{estudiante.nombre} {estudiante.apellido}</p>
                                    {estudiante.telefono && <p className="text-xs text-gray-500">{estudiante.telefono}</p>}
                                </div>
                                <button onClick={() => setTooltip(false)} className="text-gray-400 hover:text-gray-600">✕</button>
                            </div>
                            <BarraProgreso nivelActual={estudiante.nivelActual} completado={estudiante.completado} NIVELES={NIVELES} />
                            <p className="text-xs text-gray-500 mt-2">{nivel.icono} Nivel {nivel.romano}: {nivel.nombre} {estudiante.completado ? '✅' : '(en progreso)'}</p>
                            {estudiante.notas && <p className="text-xs text-gray-500 mt-2 bg-gray-50 rounded p-2">📝 {estudiante.notas}</p>}
                            {esAdmin && (
                                <div className="flex space-x-2 mt-3">
                                    <button onClick={() => { onVerProgreso && onVerProgreso(estudiante); setTooltip(false); }}

                const unsubscribe = db.collection('peticiones_oracion')
                    .orderBy('createdAt', 'desc')
                    .onSnapshot(snap => {
                        setPeticiones(snap.docs.map(d => ({ id: d.id, ...d.data() })));

                return () => unsubscribe();

                    orada: !p.orada,

                    oradaPor: !p.orada ? nombreUsuario : null
                });
