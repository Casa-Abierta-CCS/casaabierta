<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Abierta - Sistema de Gestión</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#DC2626">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Casa Abierta">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <link rel="icon" href="icon-512.png" type="image/png">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar-fixed {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 240px;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .content-area {
            margin-left: 240px;
        }
        .login-bg {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        }
        /* Scrollbar personalizado para sidebar */
        .sidebar-fixed::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar-fixed::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        .sidebar-fixed::-webkit-scrollbar-thumb {
            background: #DC2626;
            border-radius: 3px;
        }
        /* Backdrop oscuro para móvil */
        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 99;
        }
        /* Móvil: sidebar oculto por defecto */
        @media (max-width: 768px) {
            .sidebar-fixed {
                transform: translateX(-240px);
            }
            .sidebar-fixed.sidebar-abierto {
                transform: translateX(0);
                box-shadow: 4px 0 20px rgba(0,0,0,0.5);
            }
            .content-area {
                margin-left: 0;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#DC2626',
                        secondary: '#000000',
                        accent: '#FFFFFF',
                    }
                }
            }
        }
    </script>

    <!-- Registro del Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker registrado:', reg.scope);
                        window.__swRegistration = reg;
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Nueva versión disponible — recargar para aplicarla
                                    window.__swActualizado = true;
                                }
                            });
                        });
                    })
                    .catch(err => console.warn('[PWA] SW error:', err));
            });
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============================================
        // CONFIGURACIÓN DE FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCkLKeeaePW7wCpp3IPMrEldZTxP_SknwM",
            authDomain: "casa-abierta-ccs.firebaseapp.com",
            projectId: "casa-abierta-ccs",
            storageBucket: "casa-abierta-ccs.firebasestorage.app",
            messagingSenderId: "772790089728",
            appId: "1:772790089728:web:6180d2ad3192a6fba580e5",
            measurementId: "G-S828RLSJY9"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================
        // NOTIFICACIONES PUSH (FCM)
        // ============================================
        const VAPID_KEY = 'BGWTbfrh5jpWPJX60Pr0uUct1wUUJfyLA22GuC1vPQ0g8fykZdj7kTo-XtdUrpGDkOHQs736oSPhQlBQIYFK4g4';

        const notificacionesSoportadas = () =>
            'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;

        // Pide permiso, obtiene el token FCM del dispositivo y lo guarda en el perfil del usuario
        const activarNotificaciones = async (uid) => {
            if (!notificacionesSoportadas()) {
                alert('Este navegador no soporta notificaciones push.');
                return false;
            }
            try {
                const permiso = await Notification.requestPermission();
                if (permiso !== 'granted') {
                    alert('No se otorgó el permiso de notificaciones.');
                    return false;
                }

                const reg = window.__swRegistration || await navigator.serviceWorker.ready;
                const messaging = firebase.messaging();

                // Si la app está abierta en primer plano cuando llega el push, mostrarlo igual
                messaging.onMessage((payload) => {
                    const { title, body } = payload.data || payload.notification || {};
                    reg.showNotification(title || 'Casa Abierta', { body: body || '', icon: 'icon-192.png' });
                });

                const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
                if (!token) {
                    alert('No se pudo obtener el token de notificaciones.');
                    return false;
                }

                await db.collection('users').doc(uid).update({
                    fcmTokens: firebase.firestore.FieldValue.arrayUnion(token)
                });
                return true;
            } catch (error) {
                console.error('[FCM] Error al activar notificaciones:', error);
                alert('Error al activar las notificaciones: ' + (error?.message || error?.code || String(error)));
                return false;
            }
        };

        // ============================================
        // COMPONENTE PRINCIPAL
        // ============================================
        function App() {
            const [user, setUser] = useState(null);
            const [userProfile, setUserProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [asistencias, setAsistencias] = useState([]);
            const [configuracion, setConfiguracion] = useState({
                versiculo: "En la séptima vuelta, mientras los sacerdotes daban el toque prolongado con los cuernos, Josué les ordenó a los israelitas: «¡Griten, porque el Señor les ha entregado la ciudad!»",
                versiculoRef: "Josué 6:16",
                recordatorioUrgente: "Reunión de líderes - Viernes 8:00 PM (Zoom)"
            });
            const [installPrompt, setInstallPrompt] = useState(null);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [mostrarModalInstalar, setMostrarModalInstalar] = useState(false);

            // Capturar evento de instalación PWA
            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setInstallPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handler);
                window.addEventListener('appinstalled', () => setInstallPrompt(null));
                return () => {
                    window.removeEventListener('beforeinstallprompt', handler);
                };
            }, []);

            const handleInstall = async () => {
                if (installPrompt) {
                    installPrompt.prompt();
                    const { outcome } = await installPrompt.userChoice;
                    if (outcome === 'accepted') setInstallPrompt(null);
                } else {
                    setMostrarModalInstalar(true);
                }
            };

            // Verificar autenticación
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    setUser(user);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Cargar perfil de usuario
            useEffect(() => {
                if (!user) {
                    setUserProfile(null);
                    return;
                }

                db.collection('users').doc(user.uid).get()
                    .then((doc) => {
                        if (doc.exists) {
                            setUserProfile(doc.data());
                        } else {
                            // Crear perfil por defecto
                            // Verificar si es el admin principal
                            const esAdminPrincipal = user.email === 'tloimprimimos@gmail.com';
                            
                            const defaultProfile = {
                                email: user.email,
                                nombre: user.email.split('@')[0],
                                departamento: esAdminPrincipal ? 'Administración' : 'General',
                                rol: esAdminPrincipal ? 'admin' : 'usuario',
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            };
                            db.collection('users').doc(user.uid).set(defaultProfile);
                            setUserProfile(defaultProfile);
                        }
                    });
            }, [user]);

            // Cargar asistencias
            useEffect(() => {
                if (!user) return;

                const unsubscribe = db.collection('asistencias')
                    .orderBy('fecha', 'desc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setAsistencias(data);
                    }, (error) => {
                        console.error("Error al cargar asistencias:", error);
                    });

                return () => unsubscribe();
            }, [user]);

            // Cargar configuración
            useEffect(() => {
                if (!user) return;

                db.collection('configuracion')
                    .doc('general')
                    .get()
                    .then((doc) => {
                        if (doc.exists) {
                            setConfiguracion({...configuracion, ...doc.data()});
                        }
                    });
            }, [user]);

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-primary mx-auto mb-4"></div>
                            <p className="text-gray-600 font-semibold">Cargando...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <LoginPage />;
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Modal instalar app */}
                    {mostrarModalInstalar && (
                        <ModalInstalarApp onClose={() => setMostrarModalInstalar(false)} />
                    )}

                    {/* Backdrop móvil */}
                    {sidebarOpen && (
                        <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />
                    )}

                    {/* Sidebar Fijo */}
                    <Sidebar
                        currentView={currentView}
                        setCurrentView={setCurrentView}
                        user={user}
                        installPrompt={installPrompt}
                        handleInstall={handleInstall}
                        isOpen={sidebarOpen}
                        onClose={() => setSidebarOpen(false)}
                    />

                    {/* Área de contenido */}
                    <div className="content-area">
                        {/* Header con versículo */}
                        <HeaderWithVerse configuracion={configuracion} onMenuToggle={() => setSidebarOpen(o => !o)} />
                        
                        {/* Contenido principal */}
                        <main className="p-6">
                            {currentView === 'dashboard' && (
                                <Dashboard 
                                    asistencias={asistencias} 
                                    configuracion={configuracion}
                                />
                            )}
                            {currentView === 'asistencia' && <Asistencia asistencias={asistencias} />}
                            {currentView === 'calendario' && <Calendario />}
                            {currentView === 'reportes' && <Reportes asistencias={asistencias} />}
                            {currentView === 'inventario' && <Inventario userProfile={userProfile} />}
                            {currentView === 'asignaciones' && <Asignaciones userProfile={userProfile} />}
                            {currentView === 'escuela' && <EscuelaAdora userProfile={userProfile} />}
                            {currentView === 'visitantes' && <Visitantes />}
                            {currentView === 'evangelismo' && <Evangelismo />}
                            {currentView === 'peticiones' && <PeticionesOracion userProfile={userProfile} />}
                            {currentView === 'finanzas' && <Finanzas userProfile={userProfile} />}
                            {currentView === 'usuarios' && <GestionUsuarios userProfile={userProfile} />}
                            {currentView === 'importar' && <ImportarDatos />}
                            {currentView === 'configuracion' && (
                                <Configuracion 
                                    configuracion={configuracion}
                                    setConfiguracion={setConfiguracion}
                                    userProfile={userProfile}
                                    setUserProfile={setUserProfile}
                                />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        // ============================================
        // SIDEBAR COMPLETO
        // ============================================
        function Sidebar({ currentView, setCurrentView, user, installPrompt, handleInstall, isOpen, onClose }) {
            const menuItems = [
                { id: 'dashboard', icon: '📊', label: 'Dashboard' },
                { id: 'calendario', icon: '📅', label: 'Calendario' },
                { id: 'reportes', icon: '📈', label: 'Reportes y Estadísticas' },
                { id: 'inventario', icon: '📦', label: 'Inventario' },
                { id: 'asignaciones', icon: '👥', label: 'Asignaciones' },
                { id: 'escuela', icon: '🎓', label: 'Escuela Adora' },
                { id: 'asistencia', icon: '✅', label: 'Asistencia' },
                { id: 'visitantes', icon: '🆕', label: 'Visitantes' },
                { id: 'evangelismo', icon: '🕊️', label: 'Evangelismo' },
                { id: 'peticiones', icon: '🙏', label: 'Peticiones de Oración' },
                { id: 'finanzas', icon: '💰', label: 'Finanzas' },
                { id: 'usuarios', icon: '👤', label: 'Gestión de Usuarios' },
                { id: 'importar', icon: '📥', label: 'Importar Datos' },
                { id: 'configuracion', icon: '⚙️', label: 'Configuración' },
            ];

            return (
                <div className={`sidebar-fixed bg-secondary text-white flex flex-col${isOpen ? ' sidebar-abierto' : ''}`}>
                    {/* Logo */}
                    <div className="px-5 py-4 border-b border-gray-800 flex-shrink-0">
                        <img src="logo-blanco.png" alt="Casa Abierta" className="w-full" style={{maxWidth:'180px'}} />
                    </div>

                    {/* Usuario */}
                    <div className="p-4 border-b border-gray-800 flex-shrink-0">
                        <p className="text-xs text-gray-400">Conectado como:</p>
                        <p className="text-sm font-semibold truncate">{user.email}</p>
                    </div>

                    {/* Menú — ocupa el espacio disponible y hace scroll si hace falta */}
                    <nav className="flex-1 overflow-y-auto py-4">
                        {menuItems.map(item => (
                            <button
                                key={item.id}
                                onClick={() => { setCurrentView(item.id); onClose(); }}
                                className={`w-full text-left px-6 py-3 flex items-center space-x-3 transition-colors ${
                                    currentView === item.id
                                        ? 'bg-primary text-white'
                                        : 'text-gray-300 hover:bg-gray-800'
                                }`}
                            >
                                <span className="text-xl">{item.icon}</span>
                                <span className="font-medium">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {/* Cerrar sesión + Instalar PWA — siempre al fondo, nunca tapa el menú */}
                    <div className="flex-shrink-0 p-4 border-t border-gray-800 space-y-2">
                        {/* Botón instalar app — siempre visible en móvil */}
                        <button
                            onClick={handleInstall}
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded-lg font-semibold transition-colors flex items-center justify-center space-x-2"
                        >
                            <span>📲</span>
                            <span>{installPrompt ? 'Instalar App' : 'Cómo instalar'}</span>
                        </button>
                        <button
                            onClick={() => auth.signOut()}
                            className="w-full bg-gray-800 hover:bg-gray-700 text-white py-2 px-4 rounded-lg font-semibold transition-colors flex items-center justify-center space-x-2"
                        >
                            <span>🚪</span>
                            <span>Cerrar Sesión</span>
                        </button>
                    </div>
                </div>
            );
        }

        // ============================================
        // MODAL INSTALAR APP
        // ============================================
        function ModalInstalarApp({ onClose }) {
            const ua = navigator.userAgent;
            const esIOS = /iPhone|iPad|iPod/.test(ua);
            const esAndroid = /Android/.test(ua);

            return (
                <div className="fixed inset-0 z-50 flex items-end justify-center p-4" style={{background:'rgba(0,0,0,0.7)'}}>
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                        {/* Header */}
                        <div className="bg-primary px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <img src="icon-192.png" alt="ícono" className="w-10 h-10 rounded-xl" />
                                <div>
                                    <p className="font-bold text-white text-lg leading-tight">Casa Abierta</p>
                                    <p className="text-red-200 text-xs">Instalar en tu celular</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-white text-2xl leading-none">&times;</button>
                        </div>

                        {/* Instrucciones */}
                        <div className="px-6 py-5">
                            {esIOS ? (
                                <div className="space-y-4">
                                    <p className="text-gray-600 text-sm">Sigue estos pasos en <strong>Safari</strong>:</p>
                                    <div className="space-y-3">
                                        {[
                                            { paso:'1', icono:'⬆️', texto:'Toca el botón Compartir (cuadrado con flecha) en la barra inferior de Safari' },
                                            { paso:'2', icono:'📲', texto:'Desplázate y toca "Agregar a pantalla de inicio"' },
                                            { paso:'3', icono:'✅', texto:'Toca "Agregar" en la esquina superior derecha' },
                                        ].map(({paso, icono, texto}) => (
                                            <div key={paso} className="flex items-start space-x-3">
                                                <span className="flex-shrink-0 w-7 h-7 bg-primary text-white rounded-full flex items-center justify-center text-xs font-bold">{paso}</span>
                                                <p className="text-gray-700 text-sm leading-snug"><span className="mr-1">{icono}</span>{texto}</p>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-xs text-gray-400 mt-2">⚠️ Debe abrirse en Safari, no en Chrome ni otro navegador.</p>
                                </div>
                            ) : esAndroid ? (
                                <div className="space-y-4">
                                    <p className="text-gray-600 text-sm">Sigue estos pasos en <strong>Chrome</strong>:</p>
                                    <div className="space-y-3">
                                        {[
                                            { paso:'1', icono:'⋮', texto:'Toca los 3 puntos (⋮) en la esquina superior derecha de Chrome' },
                                            { paso:'2', icono:'📲', texto:'Selecciona "Añadir a pantalla de inicio" o "Instalar aplicación"' },
                                            { paso:'3', icono:'✅', texto:'Toca "Instalar" o "Añadir" para confirmar' },
                                        ].map(({paso, icono, texto}) => (
                                            <div key={paso} className="flex items-start space-x-3">
                                                <span className="flex-shrink-0 w-7 h-7 bg-primary text-white rounded-full flex items-center justify-center text-xs font-bold">{paso}</span>
                                                <p className="text-gray-700 text-sm leading-snug"><span className="mr-1 font-bold">{icono}</span>{texto}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    <p className="text-gray-600 text-sm">Desde el navegador en tu computadora:</p>
                                    <div className="flex items-start space-x-3">
                                        <span className="flex-shrink-0 w-7 h-7 bg-primary text-white rounded-full flex items-center justify-center text-xs font-bold">1</span>
                                        <p className="text-gray-700 text-sm">Busca el ícono de instalación (⊕) en la barra de dirección de Chrome y haz clic en él.</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="px-6 pb-5">
                            <button onClick={onClose}
                                className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition-colors">
                                Cerrar
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // HEADER CON VERSÍCULO
        // ============================================
        function HeaderWithVerse({ configuracion, onMenuToggle }) {
            return (
                <div className="bg-white border-b border-gray-200 px-4 py-4 md:px-6 md:py-6">
                    <div className="max-w-7xl mx-auto flex items-center gap-3">
                        {/* Botón hamburger — solo visible en móvil */}
                        <button
                            onClick={onMenuToggle}
                            className="md:hidden flex-shrink-0 w-10 h-10 flex flex-col items-center justify-center gap-1.5 rounded-lg bg-secondary text-white hover:bg-gray-800 transition-colors"
                            aria-label="Abrir menú"
                        >
                            <span className="block w-5 h-0.5 bg-white"></span>
                            <span className="block w-5 h-0.5 bg-white"></span>
                            <span className="block w-5 h-0.5 bg-white"></span>
                        </button>

                        {/* Versículo */}
                        <div className="flex-1 bg-gradient-to-r from-primary to-red-700 text-white px-4 py-3 md:p-6 rounded-lg shadow-lg">
                            <p className="text-xs md:text-sm font-semibold mb-1">{configuracion.versiculoRef}</p>
                            <p className="text-sm md:text-lg italic leading-snug md:leading-relaxed">
                                "{configuracion.versiculo}"
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // DASHBOARD REDISEÑADO
        // ============================================
        function Dashboard({ asistencias, configuracion }) {
            const [eventos, setEventos] = useState([]);
            const [visitantes, setVisitantes] = useState([]);
            const [consumibles, setConsumibles] = useState([]);

            // Cargar eventos de Firebase
            useEffect(() => {
                const unsubscribe = db.collection('eventos')
                    .orderBy('fecha', 'asc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setEventos(data);
                    });

                return () => unsubscribe();
            }, []);

            // Cargar visitantes
            useEffect(() => {
                const unsubscribe = db.collection('visitantes')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setVisitantes(data);
                    });

                return () => unsubscribe();
            }, []);

            // Cargar consumibles para alertas
            useEffect(() => {
                const unsubscribe = db.collection('inventario_consumibles')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setConsumibles(data);
                    });

                return () => unsubscribe();
            }, []);

            // Calcular métricas
            const totalEventos = asistencias.length;
            const totalMiembros = asistencias.reduce((sum, a) => sum + (parseInt(a.miembros) || 0), 0);
            const totalNinos = asistencias.reduce((sum, a) => sum + (parseInt(a.ninos) || 0), 0);
            const totalVisitantes = asistencias.reduce((sum, a) => sum + (parseInt(a.visitantes) || 0), 0);

            // Promedio de asistencia (últimos 30 días)
            const hoy = new Date();
            const hace30dias = new Date(hoy.getTime() - 30 * 24 * 60 * 60 * 1000);
            const asistenciasRecientes = asistencias.filter(a => {
                const fecha = new Date(a.fecha);
                return fecha >= hace30dias;
            });
            const promedioAsistencia = asistenciasRecientes.length > 0
                ? Math.round(
                    asistenciasRecientes.reduce((sum, a) => 
                        sum + (parseInt(a.miembros) || 0) + (parseInt(a.ninos) || 0) + (parseInt(a.visitantes) || 0), 0
                    ) / asistenciasRecientes.length
                )
                : 0;

            // Próxima actividad del calendario
            hoy.setHours(0, 0, 0, 0);
            const proximoEvento = eventos
                .filter(e => new Date(e.fecha) >= hoy)
                .sort((a, b) => {
                    const fechaA = new Date(`${a.fecha} ${a.horaInicio}`);
                    const fechaB = new Date(`${b.fecha} ${b.horaInicio}`);
                    return fechaA - fechaB;
                })[0];

            const proximaActividad = proximoEvento 
                ? `${proximoEvento.titulo} - ${proximoEvento.fecha.split('-').reverse().join('/')} ${proximoEvento.horaInicio}`
                : "No hay eventos programados";

            // Total de visitantes únicos
            const totalVisitantesUnicos = visitantes.length;

            // Alertas de inventario
            const alertasInventario = consumibles.filter(item => {
                const cantidad = parseFloat(item.cantidadActual) || 0;
                const minimo = parseFloat(item.stockMinimo) || 0;
                return cantidad === 0 || cantidad <= minimo;
            }).length;

            // Cumpleaños esta semana
            const ahora = new Date();
            const hoyMidnight = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
            const inicioDeSemana = new Date(hoyMidnight);
            inicioDeSemana.setDate(hoyMidnight.getDate() - hoyMidnight.getDay());
            const finDeSemana = new Date(inicioDeSemana);
            finDeSemana.setDate(inicioDeSemana.getDate() + 6);

            const cumpleaniosEstasSemana = visitantes
                .filter(v => {
                    if (!v.cumpleanos) return false;
                    const partes = v.cumpleanos.split('-');
                    if (partes.length < 3) return false;
                    const mes = parseInt(partes[1]);
                    const dia = parseInt(partes[2]);
                    const fechaCumple = new Date(ahora.getFullYear(), mes - 1, dia);
                    return fechaCumple >= inicioDeSemana && fechaCumple <= finDeSemana;
                })
                .map(v => {
                    const partes = v.cumpleanos.split('-');
                    const mes = parseInt(partes[1]);
                    const dia = parseInt(partes[2]);
                    const fechaCumple = new Date(ahora.getFullYear(), mes - 1, dia);
                    const esHoy = fechaCumple.getTime() === hoyMidnight.getTime();
                    return { ...v, fechaCumple, esHoy };
                })
                .sort((a, b) => a.fechaCumple - b.fechaCumple);

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <h2 className="text-3xl font-bold text-secondary">Dashboard</h2>

                    {/* Métricas principales */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                        {/* 1. Recordatorio Urgente */}
                        <div className="bg-gradient-to-br from-red-600 to-red-700 text-white rounded-lg shadow-lg p-6">
                            <div className="flex items-center justify-between mb-2">
                                <span className="text-3xl">🚨</span>
                                <span className="bg-white text-red-600 text-xs font-bold px-2 py-1 rounded">URGENTE</span>
                            </div>
                            <h3 className="text-sm font-semibold mb-2 opacity-90">Recordatorio</h3>
                            <p className="text-lg font-bold leading-tight">
                                {configuracion.recordatorioUrgente}
                            </p>
                        </div>

                        {/* 2. Próxima Actividad */}
                        <div className="bg-white rounded-lg shadow-md p-6 border-l-4 border-blue-500">
                            <div className="text-4xl mb-2">📅</div>
                            <h3 className="text-sm font-semibold text-gray-600 mb-2">Próxima Actividad</h3>
                            <p className="text-lg font-bold text-secondary">
                                {proximaActividad}
                            </p>
                        </div>

                        {/* 3. Promedio Asistencia */}
                        <div className="bg-white rounded-lg shadow-md p-6 border-l-4 border-green-500">
                            <div className="text-4xl mb-2">📊</div>
                            <h3 className="text-sm font-semibold text-gray-600 mb-2">Promedio Asistencia</h3>
                            <p className="text-3xl font-bold text-secondary">{promedioAsistencia}</p>
                            <p className="text-xs text-gray-500 mt-1">Últimos 30 días</p>
                        </div>

                        {/* 4. Alertas de Inventario */}
                        <div className="bg-white rounded-lg shadow-md p-6 border-l-4 border-yellow-500">
                            <div className="text-4xl mb-2">⚠️</div>
                            <h3 className="text-sm font-semibold text-gray-600 mb-2">Alertas Inventario</h3>
                            <p className="text-3xl font-bold text-secondary">{alertasInventario}</p>
                            <p className="text-xs text-gray-500 mt-1">Items críticos</p>
                        </div>

                        {/* 5. Participantes Escuela Adora */}
                        <div className="bg-white rounded-lg shadow-md p-6 border-l-4 border-purple-500">
                            <div className="text-4xl mb-2">🆕</div>
                            <h3 className="text-sm font-semibold text-gray-600 mb-2">Visitantes Registrados</h3>
                            <p className="text-3xl font-bold text-secondary">{totalVisitantesUnicos}</p>
                            <p className="text-xs text-gray-500 mt-1">Total histórico</p>
                        </div>
                    </div>

                    {/* Notificaciones de Cumpleaños */}
                    {cumpleaniosEstasSemana.length > 0 && (
                        <div className="bg-gradient-to-r from-pink-50 to-purple-50 border border-pink-200 rounded-lg shadow-md p-6">
                            <h3 className="text-xl font-bold text-secondary mb-4 flex items-center space-x-2">
                                <span>🎂</span>
                                <span>Cumpleaños esta semana</span>
                                <span className="ml-2 bg-pink-500 text-white text-sm font-bold px-2.5 py-0.5 rounded-full">
                                    {cumpleaniosEstasSemana.length}
                                </span>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                {cumpleaniosEstasSemana.map(v => (
                                    <div key={v.id} className={`flex items-center space-x-4 p-4 rounded-xl border-2 transition-all ${
                                        v.esHoy
                                            ? 'bg-yellow-50 border-yellow-400 shadow-md animate-pulse'
                                            : 'bg-white border-pink-200 hover:shadow-md'
                                    }`}>
                                        <div className="text-4xl flex-shrink-0">{v.esHoy ? '🎉' : '🎂'}</div>
                                        <div className="min-w-0">
                                            <p className="font-bold text-secondary text-lg leading-tight">
                                                {v.nombre} {v.apellido}
                                            </p>
                                            <p className={`text-sm font-semibold mt-0.5 ${v.esHoy ? 'text-yellow-700' : 'text-pink-600'}`}>
                                                {v.esHoy
                                                    ? '¡HOY es su cumpleaños!'
                                                    : v.fechaCumple.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}
                                            </p>
                                            {v.telefono && (
                                                <p className="text-xs text-gray-400 mt-1">📱 {v.telefono}</p>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Calendario Mensual Grande */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <h3 className="text-xl font-bold text-secondary mb-4">Calendario del Mes</h3>
                        <CalendarioMensual eventos={eventos} />
                    </div>

                    {/* Últimas Asistencias */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <h3 className="text-xl font-bold text-secondary mb-4">Últimas Asistencias Registradas</h3>
                        
                        {asistencias.length === 0 ? (
                            <div className="text-center text-gray-500 py-8">
                                No hay registros de asistencia aún.
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="border-b-2 border-gray-200">
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Fecha</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Evento</th>
                                            <th className="text-center py-3 px-4 font-semibold text-gray-700">Miembros</th>
                                            <th className="text-center py-3 px-4 font-semibold text-gray-700">Niños</th>
                                            <th className="text-center py-3 px-4 font-semibold text-gray-700">Visitantes</th>
                                            <th className="text-center py-3 px-4 font-semibold text-gray-700">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {asistencias.slice(0, 5).map(asistencia => {
                                            const total = (parseInt(asistencia.miembros) || 0) + 
                                                         (parseInt(asistencia.ninos) || 0) + 
                                                         (parseInt(asistencia.visitantes) || 0);
                                            return (
                                                <tr key={asistencia.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                    <td className="py-3 px-4">{asistencia.fecha}</td>
                                                    <td className="py-3 px-4">{asistencia.tipoEvento}</td>
                                                    <td className="py-3 px-4 text-center">{asistencia.miembros}</td>
                                                    <td className="py-3 px-4 text-center">{asistencia.ninos}</td>
                                                    <td className="py-3 px-4 text-center">
                                                        <span className="bg-primary text-white px-3 py-1 rounded-full text-sm font-semibold">
                                                            {asistencia.visitantes}
                                                        </span>
                                                    </td>
                                                    <td className="py-3 px-4 text-center font-bold text-lg">{total}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // CALENDARIO MENSUAL (Vista Dashboard - Simplificada)
        // ============================================
        function CalendarioMensual({ eventos }) {
            const [mesActual, setMesActual] = useState(new Date().getMonth());
            const [anioActual, setAnioActual] = useState(new Date().getFullYear());

            const nombresMeses = [
                'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
            ];

            const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

            // Obtener primer día del mes y total de días
            const primerDia = new Date(anioActual, mesActual, 1).getDay();
            const totalDias = new Date(anioActual, mesActual + 1, 0).getDate();

            // Crear array de días
            const dias = [];
            
            // Días vacíos antes del primer día
            for (let i = 0; i < primerDia; i++) {
                dias.push(null);
            }
            
            // Días del mes
            for (let dia = 1; dia <= totalDias; dia++) {
                dias.push(dia);
            }

            const hoy = new Date();
            const esHoy = (dia) => {
                return dia === hoy.getDate() && 
                       mesActual === hoy.getMonth() && 
                       anioActual === hoy.getFullYear();
            };

            const eventosDelDia = (dia) => {
                if (!dia) return [];
                const fechaBuscada = `${anioActual}-${String(mesActual + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                return eventos.filter(e => e.fecha === fechaBuscada);
            };

            const colorEvento = {
                'Experiencia ADORA': 'bg-blue-100 border-blue-500',
                'Reunión de Oración': 'bg-purple-100 border-purple-500',
                'Escuela Adora': 'bg-green-100 border-green-500',
                'Evento Especial': 'bg-red-100 border-red-500',
                'Juventud': 'bg-yellow-100 border-yellow-500',
                'Niños': 'bg-pink-100 border-pink-500',
                'Open House': 'bg-indigo-100 border-indigo-500',
                'Ayuno': 'bg-gray-100 border-gray-500',
                'Conferencia': 'bg-orange-100 border-orange-500'
            };

            const mesAnterior = () => {
                if (mesActual === 0) {
                    setMesActual(11);
                    setAnioActual(anioActual - 1);
                } else {
                    setMesActual(mesActual - 1);
                }
            };

            const mesSiguiente = () => {
                if (mesActual === 11) {
                    setMesActual(0);
                    setAnioActual(anioActual + 1);
                } else {
                    setMesActual(mesActual + 1);
                }
            };

            return (
                <div>
                    {/* Header del calendario */}
                    <div className="flex items-center justify-between mb-6">
                        <h4 className="text-2xl font-bold text-secondary">
                            {nombresMeses[mesActual]} {anioActual}
                        </h4>
                        <div className="flex space-x-2">
                            <button 
                                onClick={mesAnterior}
                                className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold"
                            >
                                ← Anterior
                            </button>
                            <button 
                                onClick={mesSiguiente}
                                className="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold"
                            >
                                Siguiente →
                            </button>
                        </div>
                    </div>

                    {/* Grid del calendario */}
                    <div className="border border-gray-200 rounded-lg overflow-hidden">
                        {/* Cabecera días de la semana */}
                        <div className="grid grid-cols-7 bg-gray-100">
                            {diasSemana.map(dia => (
                                <div key={dia} className="text-center font-bold text-gray-700 py-3 border-r border-gray-200 last:border-r-0">
                                    {dia}
                                </div>
                            ))}
                        </div>

                        {/* Días del mes */}
                        <div className="grid grid-cols-7">
                            {dias.map((dia, index) => {
                                const eventosHoy = eventosDelDia(dia);

                                return (
                                    <div
                                        key={index}
                                        className={`min-h-24 p-2 border-r border-b border-gray-200 ${
                                            dia ? 'bg-white hover:bg-gray-50' : 'bg-gray-50'
                                        } ${esHoy(dia) ? 'bg-blue-50' : ''}`}
                                    >
                                        {dia && (
                                            <>
                                                <div className={`text-sm font-semibold mb-1 ${
                                                    esHoy(dia) ? 'text-blue-600' : 'text-gray-700'
                                                }`}>
                                                    {dia}
                                                    {esHoy(dia) && <span className="ml-1 text-xs">(Hoy)</span>}
                                                </div>
                                                
                                                <div className="space-y-1">
                                                    {eventosHoy.map(evento => (
                                                        <div
                                                            key={evento.id}
                                                            className={`text-xs p-1 rounded border-l-2 ${
                                                                colorEvento[evento.tipoEvento] || 'bg-gray-100 border-gray-500'
                                                            }`}
                                                            title={evento.titulo}
                                                        >
                                                            {evento.titulo.substring(0, 20)}{evento.titulo.length > 20 ? '...' : ''}
                                                        </div>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Leyenda de colores */}
                    <div className="mt-4 flex flex-wrap gap-4 text-sm">
                        <div className="flex items-center space-x-2">
                            <div className="w-4 h-4 bg-blue-100 border-l-2 border-blue-500"></div>
                            <span>Culto</span>
                        </div>
                        <div className="flex items-center space-x-2">
                            <div className="w-4 h-4 bg-purple-100 border-l-2 border-purple-500"></div>
                            <span>Oración</span>
                        </div>
                        <div className="flex items-center space-x-2">
                            <div className="w-4 h-4 bg-green-100 border-l-2 border-green-500"></div>
                            <span>Estudio</span>
                        </div>
                        <div className="flex items-center space-x-2">
                            <div className="w-4 h-4 bg-red-100 border-l-2 border-red-500"></div>
                            <span>Especial</span>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================
        // MÓDULO DE CONFIGURACIÓN
        // ============================================
        function Configuracion({ configuracion, setConfiguracion, userProfile, setUserProfile }) {
            const [editando, setEditando] = useState(false);
            const [formData, setFormData] = useState(configuracion);
            const [guardando, setGuardando] = useState(false);
            const [editandoPerfil, setEditandoPerfil] = useState(false);
            const [perfilData, setPerfilData] = useState({ nombre: userProfile?.nombre || '', departamento: userProfile?.departamento || '', telefono: userProfile?.telefono || '' });
            const [guardandoPerfil, setGuardandoPerfil] = useState(false);
            const [activandoNotif, setActivandoNotif] = useState(false);
            const [notifPermiso, setNotifPermiso] = useState(
                (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported'
            );
            // null = todavía no se sabe, true/false = verificado contra Firestore (independiente del permiso del navegador)
            const [tokenGuardado, setTokenGuardado] = useState(null);

            const currentUser = auth.currentUser;

            useEffect(() => {
                if (!currentUser) return;
                db.collection('users').doc(currentUser.uid).get().then(doc => {
                    setTokenGuardado(((doc.data() || {}).fcmTokens || []).length > 0);
                });
            }, [currentUser?.uid]);

            const handleActivarNotificaciones = async () => {
                setActivandoNotif(true);
                const ok = await activarNotificaciones(currentUser.uid);
                setNotifPermiso((typeof Notification !== 'undefined') ? Notification.permission : 'unsupported');
                if (ok) {
                    setTokenGuardado(true);
                    alert('✓ Notificaciones activadas — recibirás un recordatorio el día antes de cada tarea asignada');
                }
                setActivandoNotif(false);
            };

            const handleGuardarPerfil = async () => {
                if (!perfilData.nombre.trim()) { alert('El nombre no puede estar vacío'); return; }
                setGuardandoPerfil(true);
                try {
                    await db.collection('users').doc(currentUser.uid).update({
                        nombre: perfilData.nombre.trim(),
                        departamento: perfilData.departamento.trim(),
                        telefono: perfilData.telefono.trim(),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setUserProfile({ ...userProfile, nombre: perfilData.nombre.trim(), departamento: perfilData.departamento.trim(), telefono: perfilData.telefono.trim() });
                    setEditandoPerfil(false);
                    alert('✓ Perfil actualizado');
                } catch (e) {
                    alert('Error al guardar el perfil');
                }
                setGuardandoPerfil(false);
            };

            const handleGuardar = async () => {
                setGuardando(true);
                try {
                    await db.collection('configuracion').doc('general').set(formData);
                    setConfiguracion(formData);
                    setEditando(false);
                    alert('✓ Configuración guardada exitosamente');
                } catch (error) {
                    console.error('Error al guardar:', error);
                    alert('Error al guardar la configuración');
                }
                setGuardando(false);
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="flex items-center justify-between mb-2">
                        <h2 className="text-3xl font-bold text-secondary">⚙️ Configuración</h2>
                    </div>

                    {/* Mi Perfil */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-bold text-secondary">👤 Mi Perfil</h3>
                            {!editandoPerfil && (
                                <button onClick={() => setEditandoPerfil(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 text-sm">
                                    ✏️ Editar
                                </button>
                            )}
                        </div>

                        {!editandoPerfil ? (
                            <div className="flex items-center space-x-4">
                                <div className="w-16 h-16 bg-primary rounded-full flex items-center justify-center text-white text-2xl font-bold">
                                    {(userProfile?.nombre || currentUser?.email || '?')[0].toUpperCase()}
                                </div>
                                <div>
                                    <p className="text-xl font-bold text-secondary">{userProfile?.nombre || '(sin nombre)'}</p>
                                    <p className="text-gray-500">{currentUser?.email}</p>
                                    <p className="text-sm text-gray-400">{userProfile?.departamento || 'Sin departamento'} • {userProfile?.rol || 'usuario'}</p>
                                    <p className="text-sm text-gray-400">
                                        📱 {userProfile?.telefono || <span className="text-red-500">Sin teléfono — agrégalo para recibir recordatorios</span>}
                                    </p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block font-semibold mb-2 text-sm">Nombre completo *</label>
                                        <input
                                            type="text"
                                            value={perfilData.nombre}
                                            onChange={e => setPerfilData({...perfilData, nombre: e.target.value})}
                                            className="w-full px-4 py-2 border rounded-lg"
                                            placeholder="Ej: Jesús García"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-2 text-sm">Departamento</label>
                                        <input
                                            type="text"
                                            value={perfilData.departamento}
                                            onChange={e => setPerfilData({...perfilData, departamento: e.target.value})}
                                            className="w-full px-4 py-2 border rounded-lg"
                                            placeholder="Ej: Logística"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-semibold mb-2 text-sm">Teléfono (WhatsApp)</label>
                                        <input
                                            type="tel"
                                            value={perfilData.telefono}
                                            onChange={e => setPerfilData({...perfilData, telefono: e.target.value})}
                                            className="w-full px-4 py-2 border rounded-lg"
                                            placeholder="Ej: 04241234567"
                                        />
                                    </div>
                                </div>
                                <div className="flex space-x-3">
                                    <button onClick={handleGuardarPerfil} disabled={guardandoPerfil} className="flex-1 bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700">
                                        {guardandoPerfil ? 'Guardando...' : '✓ Guardar Perfil'}
                                    </button>
                                    <button onClick={() => setEditandoPerfil(false)} className="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg font-semibold hover:bg-gray-300">
                                        ✕ Cancelar
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Notificaciones */}
                    <div className="bg-white rounded-lg shadow-md p-6">
                        <h3 className="text-lg font-bold text-secondary mb-2">🔔 Recordatorios de tareas</h3>
                        {notifPermiso === 'unsupported' && (
                            <p className="text-sm text-gray-500">Tu navegador no soporta notificaciones push.</p>
                        )}
                        {notifPermiso === 'denied' && (

        // ============================================
        // MÓDULO DE CALENDARIO COMPLETO
        // ============================================
        function Calendario() {
            const [eventos, setEventos] = useState([]);
            const [mostrarFormulario, setMostrarFormulario] = useState(false);
            const [eventoEditando, setEventoEditando] = useState(null);
            const [mesActual, setMesActual] = useState(new Date().getMonth());
            const [anioActual, setAnioActual] = useState(new Date().getFullYear());
            const [formData, setFormData] = useState({
                titulo: '',
                fecha: '',
                horaInicio: '',
                horaFin: '',
                tipoEvento: 'Experiencia ADORA',
                descripcion: '',
                responsables: {
                    alabanza: '',
                    sonido: '',
                    bienvenida: '',
                    ninos: '',
                    multimedia: '',
                    oracion: ''
                }
            });
            const [saving, setSaving] = useState(false);
            const [repetir, setRepetir] = useState(false);
            const [frecuencia, setFrecuencia] = useState('semanal');
            const [repetirHasta, setRepetirHasta] = useState('');

            const tiposFijos = ['Experiencia ADORA', 'Reunión de Oración', 'Escuela Adora', 'Evento Especial', 'Juventud', 'Niños', 'Open House', 'Ayuno', 'Conferencia'];
            const esTipoPersonalizado = formData.tipoEvento !== '' && !tiposFijos.includes(formData.tipoEvento);

            const generarFechasSerie = (fechaInicio, frecuencia, fechaFin) => {
                const fechas = [];
                let actual = new Date(fechaInicio + 'T00:00:00');
                const fin = new Date(fechaFin + 'T00:00:00');
                let contador = 0;
                while (actual <= fin && contador < 104) {
                    fechas.push(actual.toISOString().split('T')[0]);
                    if (frecuencia === 'mensual') {
                        actual.setMonth(actual.getMonth() + 1);
                    } else {
                        actual.setDate(actual.getDate() + (frecuencia === 'quincenal' ? 14 : 7));
                    }
                    contador++;
                }
                return fechas;
            };

            // Cargar eventos de Firebase
            useEffect(() => {
                const unsubscribe = db.collection('eventos')
                    .orderBy('fecha', 'asc')
                    .onSnapshot((snapshot) => {
                        const data = snapshot.docs.map(doc => ({
                            id: doc.id,
                            ...doc.data()
                        }));
                        setEventos(data);
                    }, (error) => {
                        console.error("Error al cargar eventos:", error);
                    });

                return () => unsubscribe();
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!eventoEditando && repetir && !repetirHasta) {
                    alert('Selecciona hasta qué fecha se debe repetir el evento');
                    return;
                }

                setSaving(true);

                try {
                    if (!eventoEditando && repetir) {
                        const fechas = generarFechasSerie(formData.fecha, frecuencia, repetirHasta);
                        const serieId = `serie_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                        const batch = db.batch();
                        fechas.forEach(fecha => {
                            const ref = db.collection('eventos').doc();
                            batch.set(ref, {
                                ...formData,
                                fecha,
                                serieId,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        });
                        await batch.commit();
                        alert(`✓ Serie creada: ${fechas.length} eventos programados`);
                    } else {
                        const eventoData = {
                            ...formData,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        };

                        if (eventoEditando) {
                            await db.collection('eventos').doc(eventoEditando.id).update(eventoData);
                            alert('✓ Evento actualizado exitosamente');
                        } else {
                            await db.collection('eventos').add(eventoData);
                            alert('✓ Evento creado exitosamente');
                        }
                    }

                    // Limpiar formulario
                    setFormData({
                        titulo: '',
                        fecha: '',
                        horaInicio: '',
                        horaFin: '',
                        tipoEvento: 'Experiencia ADORA',
                        descripcion: '',
                        responsables: {
                            alabanza: '',
                            sonido: '',
                            bienvenida: '',
                            ninos: '',
                            multimedia: '',
                            oracion: ''
                        }
                    });
                    setRepetir(false);
                    setFrecuencia('semanal');
                    setRepetirHasta('');
                    setMostrarFormulario(false);
                    setEventoEditando(null);
                } catch (error) {
                    console.error('Error al guardar evento:', error);
                    alert('Error al guardar el evento');
                }

                setSaving(false);
            };

            const handleEditar = (evento) => {
                setEventoEditando(evento);
                setFormData({
                    titulo: evento.titulo || '',
                    fecha: evento.fecha || '',
                    horaInicio: evento.horaInicio || '',
                    horaFin: evento.horaFin || '',
                    tipoEvento: evento.tipoEvento || 'Experiencia ADORA',
                    descripcion: evento.descripcion || '',
                    responsables: evento.responsables || {
                        alabanza: '',
                        sonido: '',
                        bienvenida: '',
                        ninos: '',
                        multimedia: '',
                        oracion: ''
                    }
                });
                setRepetir(false);
                setFrecuencia('semanal');
                setRepetirHasta('');
                setMostrarFormulario(true);
            };

            const handleEliminar = async (evento) => {
                if (evento.serieId) {
                    const borrarSerie = window.confirm(
                        'Este evento pertenece a una serie repetitiva.\n\nPresiona ACEPTAR para eliminar TODA la serie (todas las fechas repetidas de este evento).\nPresiona CANCELAR si quieres elegir eliminar solo este día.'
                    );
                    if (borrarSerie) {
                        if (!window.confirm('¿Confirmas eliminar TODOS los eventos de esta serie? Esta acción no se puede deshacer.')) return;
                        try {
                            const snapshot = await db.collection('eventos').where('serieId', '==', evento.serieId).get();
                            const batch = db.batch();
                            snapshot.docs.forEach(doc => batch.delete(doc.ref));
                            await batch.commit();
                            alert('✓ Serie de eventos eliminada');
                        } catch (error) {
                            console.error('Error al eliminar la serie:', error);
                            alert('Error al eliminar la serie de eventos');
                        }
                        return;
                    }
                    if (!window.confirm('¿Eliminar solo este evento (un día)?')) return;
                    try {
                        await db.collection('eventos').doc(evento.id).delete();
                        alert('✓ Evento eliminado');
                    } catch (error) {
                        console.error('Error al eliminar:', error);
                        alert('Error al eliminar el evento');
                    }
                    return;
                }

                if (window.confirm('¿Estás seguro de eliminar este evento?')) {
                    try {
                        await db.collection('eventos').doc(evento.id).delete();
                        alert('✓ Evento eliminado');
                    } catch (error) {
                        console.error('Error al eliminar:', error);
                        alert('Error al eliminar el evento');
                    }
                }
            };

            const cancelarEdicion = () => {
                setMostrarFormulario(false);
                setEventoEditando(null);
                setRepetir(false);
                setFrecuencia('semanal');
                setRepetirHasta('');
                setFormData({
                    titulo: '',
                    fecha: '',
                    horaInicio: '',
                    horaFin: '',
                    tipoEvento: 'Experiencia ADORA',
                    descripcion: '',
                    responsables: {
                        alabanza: '',
                        sonido: '',
                        bienvenida: '',
                        ninos: '',
                        multimedia: '',
                        oracion: ''
                    }
                });
            };

            // Funciones de navegación de meses
            const mesAnterior = () => {
                if (mesActual === 0) {
                    setMesActual(11);
                    setAnioActual(anioActual - 1);
                } else {
                    setMesActual(mesActual - 1);
                }
            };

            const mesSiguiente = () => {
                if (mesActual === 11) {
                    setMesActual(0);
                    setAnioActual(anioActual + 1);
                } else {
                    setMesActual(mesActual + 1);
                }
            };

            const irAHoy = () => {
                const hoy = new Date();
                setMesActual(hoy.getMonth());
                setAnioActual(hoy.getFullYear());
            };

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex items-center justify-between">
                        <h2 className="text-3xl font-bold text-secondary">Calendario de Actividades</h2>
                        <button
                            onClick={() => setMostrarFormulario(!mostrarFormulario)}
                            className="bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-red-700 flex items-center space-x-2"
                        >
                            <span>{mostrarFormulario ? '✕' : '+'}</span>
                            <span>{mostrarFormulario ? 'Cancelar' : 'Nuevo Evento'}</span>
                        </button>
                    </div>

                    {/* Formulario de Evento */}
                    {mostrarFormulario && (
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-xl font-bold text-secondary mb-4">
                                {eventoEditando ? 'Editar Evento' : 'Crear Nuevo Evento'}
                            </h3>
                            <form onSubmit={handleSubmit} className="space-y-6">
                                {/* Información básica */}
                                <div className="border-b pb-4">
                                    <h4 className="font-semibold text-gray-700 mb-3">Información del Evento</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="md:col-span-2">
                                            <label className="block text-gray-700 font-semibold mb-2">Título del Evento *</label>
                                            <input
                                                type="text"
                                                value={formData.titulo}
                                                onChange={(e) => setFormData({...formData, titulo: e.target.value})}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                placeholder="Ej: Culto de Alabanza y Adoración"
                                                required
                                            />
                                        </div>
                                        
                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-2">Fecha *</label>
                                            <input
                                                type="date"
                                                value={formData.fecha}
                                                onChange={(e) => setFormData({...formData, fecha: e.target.value})}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                required
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-2">Tipo de Evento *</label>
                                            <select
                                                value={esTipoPersonalizado ? '__otro__' : formData.tipoEvento}
                                                onChange={(e) => {
                                                    if (e.target.value === '__otro__') {
                                                        setFormData({...formData, tipoEvento: ''});
                                                    } else {
                                                        setFormData({...formData, tipoEvento: e.target.value});
                                                    }
                                                }}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                required
                                            >
                                                <option>Experiencia ADORA</option>
                                                <option>Reunión de Oración</option>
                                                <option>Escuela Adora</option>
                                                <option>Evento Especial</option>
                                                <option>Juventud</option>
                                                <option>Niños</option>
                                                <option>Open House</option>
                                                <option>Ayuno</option>
                                                <option>Conferencia</option>
                                                <option value="__otro__">✏️ Otro (personalizado)</option>
                                            </select>
                                        </div>

                                        {esTipoPersonalizado && (
                                            <div className="md:col-span-2">
                                                <label className="block text-gray-700 font-semibold mb-2">Nombre del tipo de evento personalizado *</label>
                                                <input
                                                    type="text"
                                                    value={formData.tipoEvento}
                                                    onChange={(e) => setFormData({...formData, tipoEvento: e.target.value})}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"
                                                    placeholder="Ej: Vigilia de Año Nuevo"
                                                    required
                                                />
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-gray-700 font-semibold mb-2">Hora Inicio *</label>
                                            <input
                                                type="time"
                                                value={formData.horaInicio}

                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"

                                            <textarea
                                                value={formData.descripcion}
                                                onChange={(e) => setFormData({...formData, descripcion: e.target.value})}
